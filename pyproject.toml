[project]
name = "eng-platform-api"
version = "0.5.0"
description = "Engineering Platform Control Plane API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "google-cloud-monitoring>=2.31.0",
    "google-cloud-run>=0.16.0",
    "google-cloud-bigquery>=3.42.0",
    "google-cloud-storage>=2.19.0",
    "google-cloud-firestore>=2.21.0",
    "PyGithub>=2.8.0",
    "authlib>=1.6.0",
    "httpx>=0.27.0",
    "itsdangerous>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.12.0,<0.16.0",
    "mypy>=1.17.0",
    "bandit>=1.8.0",
    "pip-audit>=2.9.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["eng_platform_api", "eng_platform_api.services", "eng_platform_api.routers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
