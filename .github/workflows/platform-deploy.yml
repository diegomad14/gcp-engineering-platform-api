name: Platform Deploy

on:
  workflow_dispatch:
    inputs:
      service_name:
        description: Cloud Run service selected in Engineering Platform
        required: true
        type: string
      tag:
        description: Immutable semantic release tag
        required: true
        type: string
      github_deployment_id:
        description: GitHub Deployment created by Engineering Platform
        required: true
        type: string
      project_id:
        description: GCP project from the platform service catalog
        required: true
        type: string
      region:
        description: Cloud Run region from the platform service catalog
        required: true
        type: string
      image_name:
        description: Artifact Registry image name for this service
        required: true
        type: string
      artifact_repository:
        description: Artifact Registry repository
        required: true
        type: string
      build_context:
        description: Docker build context for this independent service
        required: true
        type: string
      health_path:
        description: Candidate and production smoke path
        required: true
        type: string
      runner_label:
        description: Emergency runner label; leave empty for hosted runner
        required: false
        default: ""
        type: string
      platform_authorization:
        description: Signed authorization issued by Engineering Platform
        required: true
        type: string

permissions:
  contents: read
  deployments: write
  id-token: write

concurrency:
  group: deploy-${{ inputs.service_name }}
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ inputs.project_id }}
  REGION: ${{ inputs.region }}
  SERVICE_NAME: ${{ inputs.service_name }}
  IMAGE_NAME: ${{ inputs.image_name }}
  ARTIFACT_REPOSITORY: ${{ inputs.artifact_repository }}
  BUILD_CONTEXT: ${{ inputs.build_context }}
  HEALTH_PATH: ${{ inputs.health_path }}
  RELEASE_TAG: ${{ inputs.tag }}
  GITHUB_DEPLOYMENT_ID: ${{ inputs.github_deployment_id }}

jobs:
  verify-release:
    name: Verify release
    runs-on: ${{ ((github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && (inputs.runner_label == 'cgm-release-local' || (inputs.runner_label == '' && vars.CGM_ACTIONS_RUNNER == 'cgm-release-local'))) && 'cgm-release-local' || 'ubuntu-latest' }}
    outputs:
      image: ${{ steps.release.outputs.image }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.tag }}
      - name: Resolve immutable release SHA
        id: resolve-release
        env:
          RELEASE_REF: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse "$RELEASE_REF^{commit}")"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Verify Engineering Platform authorization
        uses: ./.github/actions/verify-release-authorization
        with:
          token: ${{ inputs.platform_authorization }}
          repository: ${{ github.repository }}
          service_name: ${{ inputs.service_name }}
          tag: ${{ inputs.tag }}
          sha: ${{ steps.resolve-release.outputs.sha }}
          github_deployment_id: ${{ inputs.github_deployment_id }}
          kind: deploy
          platform_api_url: ${{ vars.ENG_PLATFORM_API_URL }}
      - name: Validate immutable release and service configuration
        id: release
        env:
          RUN_VARS_GCP_RELEASE_WIF_PROVIDER: ${{ vars.GCP_RELEASE_WIF_PROVIDER }}
          RUN_VARS_GCP_WIF_SERVICE_ACCOUNT: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}
          RUN_VARS_GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]
          test -n "$PROJECT_ID"
          test -n "${RUN_VARS_GCP_RELEASE_WIF_PROVIDER}"
          test -n "${RUN_VARS_GCP_WIF_SERVICE_ACCOUNT}"
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$ARTIFACT_REPOSITORY/$IMAGE_NAME:$RELEASE_TAG"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Require exact OSS quality evidence
        uses: diegomad14/gcp-engineering-platform-api/.github/actions/verify-quality@ac9d68554c8b6332013785a5bcf451eabfee93ec
        with:
          platform-api-url: ${{ vars.ENG_PLATFORM_API_URL }}
          service-name: eng-platform-api
          commit-sha: ${{ steps.release.outputs.sha }}
          wait-seconds: '0'
      - name: Mark GitHub deployment in progress
        env:
          RUN_GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_GITHUB_SERVER_URL: ${{ github.server_url }}
          RUN_GITHUB_RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST \
            "repos/${RUN_GITHUB_REPOSITORY}/deployments/$GITHUB_DEPLOYMENT_ID/statuses" \
            -f state=in_progress \
            -f log_url="${RUN_GITHUB_SERVER_URL}/${RUN_GITHUB_REPOSITORY}/actions/runs/${RUN_GITHUB_RUN_ID}" \
            -f description='Release verification passed' >/dev/null

  build:
    name: Build image
    needs: verify-release
    runs-on: ${{ ((github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && (inputs.runner_label == 'cgm-release-local' || (inputs.runner_label == '' && vars.CGM_ACTIONS_RUNNER == 'cgm-release-local'))) && 'cgm-release-local' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.verify-release.outputs.sha }}
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_RELEASE_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
      - name: Authenticate Docker to Artifact Registry
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
      - name: Build and push immutable image
        env:
          IMAGE: ${{ needs.verify-release.outputs.image }}
        run: |
          docker build --tag "$IMAGE" "$BUILD_CONTEXT"
          docker push "$IMAGE"

  deploy-candidate:
    name: Deploy candidate
    needs: [verify-release, build]
    runs-on: ${{ ((github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && (inputs.runner_label == 'cgm-release-local' || (inputs.runner_label == '' && vars.CGM_ACTIONS_RUNNER == 'cgm-release-local'))) && 'cgm-release-local' || 'ubuntu-latest' }}
    environment: candidate
    outputs:
      revision: ${{ steps.candidate.outputs.revision }}
      url: ${{ steps.candidate.outputs.url }}
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_RELEASE_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
      - name: Deploy zero-traffic revision
        id: deploy
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3
        with:
          service: ${{ env.SERVICE_NAME }}
          image: ${{ needs.verify-release.outputs.image }}
          project_id: ${{ env.PROJECT_ID }}
          region: ${{ env.REGION }}
          no_traffic: true
          flags: --service-account=eng-platform-runtime@cgm-assistant-prod.iam.gserviceaccount.com
          env_vars: |
            ENG_PLATFORM_MOCK_MODE=false
            ENG_PLATFORM_GITHUB_ENABLED=true
            ENG_PLATFORM_API_URL=${{ vars.ENG_PLATFORM_API_URL }}
            ENG_PLATFORM_FRONTEND_URL=${{ vars.ENG_PLATFORM_FRONTEND_URL }}
            ENG_PLATFORM_ALLOWED_GITHUB_LOGINS=${{ vars.ENG_PLATFORM_ALLOWED_GITHUB_LOGINS }}
            ENG_PLATFORM_GITHUB_APP_ID=${{ vars.ENG_PLATFORM_GITHUB_APP_ID }}
            ENG_PLATFORM_GITHUB_INSTALLATION_ID=${{ vars.ENG_PLATFORM_GITHUB_INSTALLATION_ID }}
            ENG_PLATFORM_EXECUTION_REPOSITORY=${{ github.repository }}
            ENG_PLATFORM_CENTRAL_SERVICES=${{ vars.ENG_PLATFORM_CENTRAL_SERVICES }}
            ENG_PLATFORM_SECRETS_WRITER_SERVICE_ACCOUNT=${{ vars.ENG_PLATFORM_SECRETS_WRITER_SERVICE_ACCOUNT }}
            CGM_ACTIONS_RUNNER=${{ vars.CGM_ACTIONS_RUNNER }}
            ENG_PLATFORM_TRUST_IAP_IDENTITY=false
            ENG_PLATFORM_RELEASE_AUTH_FIRESTORE_COLLECTION=release_authorizations
          env_vars_update_strategy: merge
          secrets: |
            ENG_PLATFORM_GITHUB_TOKEN=eng-platform-github-token:latest
            ENG_PLATFORM_GITHUB_OAUTH_CLIENT_ID=eng-platform-oauth-client-id:latest
            ENG_PLATFORM_GITHUB_OAUTH_CLIENT_SECRET=eng-platform-oauth-client-secret:latest
            ENG_PLATFORM_SESSION_SECRET=eng-platform-session-secret:latest
            ENG_PLATFORM_RELEASE_SIGNING_PRIVATE_KEY=eng-platform-release-signing-private-key:latest
            ENG_PLATFORM_GITHUB_PRIVATE_KEY=eng-platform-github-private-key:1
          secrets_update_strategy: merge
      - name: Create candidate URL
        id: candidate
        run: |
          set -euo pipefail
          REVISION=$(gcloud run services describe "$SERVICE_NAME" --project="$PROJECT_ID" --region="$REGION" --format='value(status.latestCreatedRevisionName)')
          test -n "$REVISION"
          TAG="candidate-$RELEASE_TAG"
          TAG="${TAG//./-}"
          gcloud run services update-traffic "$SERVICE_NAME" --project="$PROJECT_ID" --region="$REGION" --set-tags="$TAG=$REVISION" --quiet
          URL=$(gcloud run services describe "$SERVICE_NAME" --project="$PROJECT_ID" --region="$REGION" --format=json | python3 -c 'import json,sys; d=json.load(sys.stdin); tag=sys.argv[1]; rows=d.get("status",{}).get("traffic",[]); print(next((r.get("url","") for r in rows if r.get("tag")==tag or r.get("tagName")==tag), ""))' "$TAG")
          test -n "$URL"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

  validate-candidate:
    name: Validate candidate
    needs: deploy-candidate
    runs-on: ${{ ((github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && (inputs.runner_label == 'cgm-release-local' || (inputs.runner_label == '' && vars.CGM_ACTIONS_RUNNER == 'cgm-release-local'))) && 'cgm-release-local' || 'ubuntu-latest' }}
    steps:
      - name: Smoke candidate revision
        env:
          RUN_NEEDS_DEPLOY_CANDIDATE_OUTPUTS_URL: ${{ needs.deploy-candidate.outputs.url }}
        run: curl --fail-with-body --retry 5 --retry-all-errors "${RUN_NEEDS_DEPLOY_CANDIDATE_OUTPUTS_URL}$HEALTH_PATH"
      - name: Publish candidate evidence
        env:
          RUN_GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_GITHUB_SERVER_URL: ${{ github.server_url }}
          RUN_GITHUB_RUN_ID: ${{ github.run_id }}
          RUN_NEEDS_DEPLOY_CANDIDATE_OUTPUTS_URL: ${{ needs.deploy-candidate.outputs.url }}
          RUN_NEEDS_DEPLOY_CANDIDATE_OUTPUTS_REVISION: ${{ needs.deploy-candidate.outputs.revision }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST \
            "repos/${RUN_GITHUB_REPOSITORY}/deployments/$GITHUB_DEPLOYMENT_ID/statuses" \
            -f state=in_progress \
            -f log_url="${RUN_GITHUB_SERVER_URL}/${RUN_GITHUB_REPOSITORY}/actions/runs/${RUN_GITHUB_RUN_ID}" \
            -f environment_url="${RUN_NEEDS_DEPLOY_CANDIDATE_OUTPUTS_URL}" \
            -f description="candidate_revision=${RUN_NEEDS_DEPLOY_CANDIDATE_OUTPUTS_REVISION}" >/dev/null

  promote:
    name: Promote production
    needs: [verify-release, deploy-candidate, validate-candidate]
    runs-on: ${{ ((github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && (inputs.runner_label == 'cgm-release-local' || (inputs.runner_label == '' && vars.CGM_ACTIONS_RUNNER == 'cgm-release-local'))) && 'cgm-release-local' || 'ubuntu-latest' }}
    environment: production
    outputs:
      previous_revision: ${{ steps.snapshot.outputs.previous_revision }}
      production_revision: ${{ steps.promote.outputs.production_revision }}
      production_url: ${{ steps.promote.outputs.production_url }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.verify-release.outputs.sha }}
          fetch-depth: 0
      - name: Require exact OSS quality evidence
        uses: diegomad14/gcp-engineering-platform-api/.github/actions/verify-quality@ac9d68554c8b6332013785a5bcf451eabfee93ec
        with:
          platform-api-url: ${{ vars.ENG_PLATFORM_API_URL }}
          service-name: eng-platform-api
          commit-sha: ${{ needs.verify-release.outputs.sha }}
          wait-seconds: '0'
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_RELEASE_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
      - name: Verify candidate artifact matches approved commit
        uses: diegomad14/gcp-engineering-platform-api/.github/actions/verify-candidate@6cfcaabc15db69ba7df3638087468433a0ad5fdf
        with:
          platform-api-url: ${{ vars.ENG_PLATFORM_API_URL }}
          service-name: ${{ inputs.service_name }}
          revision: ${{ needs.deploy-candidate.outputs.revision }}
          tag: ${{ inputs.tag }}
          commit-sha: ${{ needs.verify-release.outputs.sha }}
      - name: Snapshot current production revision
        id: snapshot
        run: |
          PREVIOUS=$(gcloud run services describe "$SERVICE_NAME" --project="$PROJECT_ID" --region="$REGION" --format='value(status.traffic[0].revisionName)')
          test -n "$PREVIOUS"
          echo "previous_revision=$PREVIOUS" >> "$GITHUB_OUTPUT"
      - name: Promote candidate to 100 percent
        id: promote
        env:
          RUN_NEEDS_DEPLOY_CANDIDATE_OUTPUTS_REVISION: ${{ needs.deploy-candidate.outputs.revision }}
        run: |
          gcloud run services update-traffic "$SERVICE_NAME" --project="$PROJECT_ID" --region="$REGION" --to-revisions="${RUN_NEEDS_DEPLOY_CANDIDATE_OUTPUTS_REVISION}=100" --quiet
          URL=$(gcloud run services describe "$SERVICE_NAME" --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)')
          echo "production_revision=${RUN_NEEDS_DEPLOY_CANDIDATE_OUTPUTS_REVISION}" >> "$GITHUB_OUTPUT"
          echo "production_url=$URL" >> "$GITHUB_OUTPUT"

  validate-production:
    name: Validate production
    needs: promote
    runs-on: ${{ ((github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && (inputs.runner_label == 'cgm-release-local' || (inputs.runner_label == '' && vars.CGM_ACTIONS_RUNNER == 'cgm-release-local'))) && 'cgm-release-local' || 'ubuntu-latest' }}
    steps:
      - name: Smoke production
        env:
          RUN_NEEDS_PROMOTE_OUTPUTS_PRODUCTION_URL: ${{ needs.promote.outputs.production_url }}
        run: curl --fail-with-body --retry 5 --retry-all-errors "${RUN_NEEDS_PROMOTE_OUTPUTS_PRODUCTION_URL}$HEALTH_PATH"
      - name: Mark GitHub deployment successful
        env:
          RUN_GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_GITHUB_SERVER_URL: ${{ github.server_url }}
          RUN_GITHUB_RUN_ID: ${{ github.run_id }}
          RUN_NEEDS_PROMOTE_OUTPUTS_PRODUCTION_URL: ${{ needs.promote.outputs.production_url }}
          RUN_NEEDS_PROMOTE_OUTPUTS_PRODUCTION_REVISION: ${{ needs.promote.outputs.production_revision }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST \
            "repos/${RUN_GITHUB_REPOSITORY}/deployments/$GITHUB_DEPLOYMENT_ID/statuses" \
            -f state=success \
            -f log_url="${RUN_GITHUB_SERVER_URL}/${RUN_GITHUB_REPOSITORY}/actions/runs/${RUN_GITHUB_RUN_ID}" \
            -f environment_url="${RUN_NEEDS_PROMOTE_OUTPUTS_PRODUCTION_URL}" \
            -f description="production_revision=${RUN_NEEDS_PROMOTE_OUTPUTS_PRODUCTION_REVISION}" >/dev/null

  rollback:
    name: Rollback production
    if: ${{ failure() && needs.promote.result == 'success' }}
    needs: [promote, validate-production]
    runs-on: ${{ ((github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && (inputs.runner_label == 'cgm-release-local' || (inputs.runner_label == '' && vars.CGM_ACTIONS_RUNNER == 'cgm-release-local'))) && 'cgm-release-local' || 'ubuntu-latest' }}
    environment: production
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_RELEASE_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
      - name: Restore previous production revision
        env:
          RUN_NEEDS_PROMOTE_OUTPUTS_PREVIOUS_REVISION: ${{ needs.promote.outputs.previous_revision }}
        run: gcloud run services update-traffic "$SERVICE_NAME" --project="$PROJECT_ID" --region="$REGION" --to-revisions="${RUN_NEEDS_PROMOTE_OUTPUTS_PREVIOUS_REVISION}=100" --quiet
      - name: Mark GitHub deployment failed and rolled back
        if: always()
        env:
          RUN_JOB_STATUS: ${{ job.status }}
          RUN_GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_GITHUB_SERVER_URL: ${{ github.server_url }}
          RUN_GITHUB_RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STATE=$([ "${RUN_JOB_STATUS}" = success ] && echo failure || echo error)
          gh api --method POST \
            "repos/${RUN_GITHUB_REPOSITORY}/deployments/$GITHUB_DEPLOYMENT_ID/statuses" \
            -f state="$STATE" \
            -f log_url="${RUN_GITHUB_SERVER_URL}/${RUN_GITHUB_REPOSITORY}/actions/runs/${RUN_GITHUB_RUN_ID}" \
            -f description='Production validation failed; rollback executed' >/dev/null

  mark-failed:
    name: Mark deployment failed
    if: ${{ failure() && needs.promote.result != 'success' }}
    needs: [verify-release, build, deploy-candidate, validate-candidate, promote]
    runs-on: ${{ ((github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && (inputs.runner_label == 'cgm-release-local' || (inputs.runner_label == '' && vars.CGM_ACTIONS_RUNNER == 'cgm-release-local'))) && 'cgm-release-local' || 'ubuntu-latest' }}
    steps:
      - name: Publish pre-traffic failure
        env:
          RUN_GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_GITHUB_SERVER_URL: ${{ github.server_url }}
          RUN_GITHUB_RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST \
            "repos/${RUN_GITHUB_REPOSITORY}/deployments/$GITHUB_DEPLOYMENT_ID/statuses" \
            -f state=failure \
            -f log_url="${RUN_GITHUB_SERVER_URL}/${RUN_GITHUB_REPOSITORY}/actions/runs/${RUN_GITHUB_RUN_ID}" \
            -f description='Deployment failed before production traffic changed' >/dev/null
