name: Platform Deploy

on:
  workflow_dispatch:
    inputs:
      service_name: {required: true, type: string}
      tag: {required: true, type: string}
      github_deployment_id: {required: true, type: string}
      project_id: {required: true, type: string}
      region: {required: true, type: string}
      image_name: {required: true, type: string}
      artifact_repository: {required: true, type: string}
      build_context: {required: true, type: string}
      health_path: {required: true, type: string}
      profile_sha256: {required: true, type: string}
      platform_authorization: {required: true, type: string}

permissions: {contents: read, deployments: write, id-token: write}

concurrency:
  group: deploy-${{ inputs.service_name }}
  cancel-in-progress: false

jobs:
  release:
    # Always GitHub-hosted. Cloud Build selection is private to the API.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.tag }}
      - name: Resolve and verify release identity
        id: release
        env:
          EXPECTED_TAG: ${{ inputs.tag }}
          DEPLOYMENT_ID: ${{ inputs.github_deployment_id }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          test "$(git rev-parse "$EXPECTED_TAG^{commit}")" = "$sha"
          fingerprint="$(printf '%s' "$DEPLOYMENT_ID|${GITHUB_REPOSITORY}|$EXPECTED_TAG|$sha|deploy" | sha256sum | cut -d' ' -f1)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Verify Engineering Platform authorization
        uses: ./.github/actions/verify-release-authorization
        with:
          token: ${{ inputs.platform_authorization }}
          repository: ${{ github.repository }}
          service_name: ${{ inputs.service_name }}
          tag: ${{ inputs.tag }}
          sha: ${{ steps.release.outputs.sha }}
          github_deployment_id: ${{ inputs.github_deployment_id }}
          kind: deploy
          platform_api_url: ${{ vars.ENG_PLATFORM_API_URL }}
          signing_public_key: ${{ vars.ENG_PLATFORM_RELEASE_SIGNING_PUBLIC_KEY }}
      - name: Require exact OSS quality evidence
        uses: diegomad14/gcp-engineering-platform-api/.github/actions/verify-quality@ac9d68554c8b6332013785a5bcf451eabfee93ec
        with:
          platform-api-url: ${{ vars.ENG_PLATFORM_API_URL }}
          service-name: ${{ inputs.service_name }}
          commit-sha: ${{ steps.release.outputs.sha }}
          wait-seconds: '0'
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GCP_RELEASE_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
      - name: Mark deployment in progress
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOYMENT_ID: ${{ inputs.github_deployment_id }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$DEPLOYMENT_ID/statuses" \
            -f state=in_progress \
            -f log_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description='Central release engine started' >/dev/null
      - name: Execute the pinned central engine
        env:
          CGM_SERVICE: ${{ inputs.service_name }}
          CGM_RELEASE_TAG: ${{ inputs.tag }}
          CGM_RELEASE_SHA: ${{ steps.release.outputs.sha }}
          CGM_PROJECT_ID: ${{ inputs.project_id }}
          CGM_REGION: ${{ inputs.region }}
          CGM_IMAGE_NAME: ${{ inputs.image_name }}
          CGM_ARTIFACT_REPOSITORY: ${{ inputs.artifact_repository }}
          CGM_BUILD_CONTEXT: ${{ inputs.build_context }}
          CGM_HEALTH_PATH: ${{ inputs.health_path }}
          CGM_DEPLOYMENT_ID: ${{ inputs.github_deployment_id }}
          CGM_OPERATION: deploy
          CGM_REPOSITORY: ${{ github.repository }}
          CGM_REQUEST_FINGERPRINT: ${{ steps.release.outputs.fingerprint }}
          CGM_PROFILE: ${{ inputs.service_name }}
          CGM_PROFILE_SHA256: ${{ inputs.profile_sha256 }}
          CGM_PLATFORM_API_URL: ${{ vars.ENG_PLATFORM_API_URL }}
          CGM_IMAGE: ${{ inputs.region }}-docker.pkg.dev/${{ inputs.project_id }}/${{ inputs.artifact_repository }}/${{ inputs.image_name }}:${{ inputs.tag }}
        run: |
          set -euo pipefail
          gcloud auth configure-docker "$CGM_REGION-docker.pkg.dev" --quiet
          credential_file="$(basename "$GOOGLE_APPLICATION_CREDENTIALS")"
          docker run --rm --network host \
            --volume "$PWD:/workspace" --volume /var/run/docker.sock:/var/run/docker.sock \
            --user "$(id -u):$(id -g)" --group-add "$(stat -c %g /var/run/docker.sock)" \
            --env HOME=/tmp \
            --workdir /workspace --env GOOGLE_APPLICATION_CREDENTIALS="/workspace/$credential_file" \
            --env CGM_SERVICE --env CGM_RELEASE_TAG --env CGM_RELEASE_SHA \
            --env CGM_PROJECT_ID --env CGM_REGION --env CGM_IMAGE_NAME \
            --env CGM_ARTIFACT_REPOSITORY --env CGM_BUILD_CONTEXT --env CGM_HEALTH_PATH \
            --env CGM_DEPLOYMENT_ID --env CGM_OPERATION --env CGM_REPOSITORY \
            --env CGM_REQUEST_FINGERPRINT --env CGM_PROFILE --env CGM_PROFILE_SHA256 \
            --env CGM_PLATFORM_API_URL \
            --env CGM_IMAGE \
            "${{ vars.ENG_PLATFORM_RELEASE_EXECUTOR_IMAGE }}" --service "$CGM_SERVICE"
      - name: Publish deployment result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOYMENT_ID: ${{ inputs.github_deployment_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state=$([ "$JOB_STATUS" = success ] && echo success || echo failure)
          description='Central release engine failed'
          args=()
          if [ -f .eng-platform-release-result.json ]; then
            revision="$(jq -r '.production_revision // empty' .eng-platform-release-result.json)"
            production_url="$(jq -r '.production_url // empty' .eng-platform-release-result.json)"
            test -z "$revision" || description="production_revision=$revision"
            test -z "$production_url" || args+=(-f "environment_url=$production_url")
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$DEPLOYMENT_ID/statuses" \
            -f state="$state" -f description="$description" \
            -f log_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            "${args[@]}" >/dev/null
