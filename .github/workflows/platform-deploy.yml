          test -n "${!name}" || { echo "Required release configuration is missing: $name" >&2; exit 1; }
        done
    - name: Validate bounded runtime execution configuration
      env:
        RELEASE_SERVICE: ${{ inputs.service_name }}
        EXECUTION_CONFIG: ${{ inputs.execution_config }}
      run: |
        set -euo pipefail
        if [[ "$RELEASE_SERVICE" != cgm-artemis-* ]]; then
