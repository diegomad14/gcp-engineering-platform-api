        PY
        jq -r '
          ["CGM_RUNTIME_KIND=" + .runtime_kind,
           "CGM_EVIDENCE_BUCKET=" + .evidence_bucket,
           "CGM_PRIVATE_RUNTIME=" + (.private_runtime | tostring),
           "CGM_DOCKERFILE_PATH=" + .dockerfile_path,
           "CGM_QUALITY_EVIDENCE_SERVICES=" + (.quality_evidence_services | join(",")),
           "CGM_REPOSITORY_ALIASES=" + (.repository_aliases | join(",")),
           "CGM_PAIRED_WEB_SHA=" + .paired_web_sha] | .[]
        ' <<<"$EXECUTION_CONFIG" >> "$GITHUB_ENV"
    - name: Require exact OSS quality evidence
      uses: diegomad14/gcp-engineering-platform-api/.github/actions/verify-quality@ac9d68554c8b6332013785a5bcf451eabfee93ec
      with:
        platform-api-url: ${{ vars.ENG_PLATFORM_API_URL }}
        service-name: ${{ inputs.service_name }}
        commit-sha: ${{ steps.release.outputs.sha }}
        wait-seconds: '0'
  candidate:
    if: ${{ inputs.service_name == 'cgm-artemis-api' || inputs.service_name == 'cgm-artemis-web' }}
    needs: verify-release
    runs-on: ubuntu-latest
    environment: candidate
    outputs:
      candidate_sha256: ${{ steps.receipt.outputs.sha256 }}
      artifact_id: ${{ steps.candidate-artifact.outputs.artifact-id }}
    steps:
    - name: Validate release executor configuration
      env:
        RELEASE_EXECUTOR_IMAGE: ${{ needs.verify-release.outputs.executor_image }}
        PLATFORM_API_URL: ${{ vars.ENG_PLATFORM_API_URL }}
        RELEASE_SIGNING_PUBLIC_KEY: ${{ vars.ENG_PLATFORM_RELEASE_SIGNING_PUBLIC_KEY }}
        RELEASE_WIF_PROVIDER: ${{ vars.GCP_RELEASE_WIF_PROVIDER }}
        RELEASE_SERVICE_ACCOUNT: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}
      run: |
        set -euo pipefail
        [[ "$RELEASE_EXECUTOR_IMAGE" =~ ^[^[:space:]@]+@sha256:[0-9a-f]{64}$ ]] || {
