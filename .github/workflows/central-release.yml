name: Central Release
run-name: Platform release ${{ inputs.deployment_id }}

on:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: Durable platform deployment identifier
        required: true
        type: string
      platform_authorization:
        description: One-use signed platform authorization (never operational secrets)
        required: true
        type: string
      runner_label:
        description: Validated runner destination
        required: true
        default: ubuntu-latest
        type: choice
        options: [ubuntu-latest, cgm-release-local]

permissions:
  contents: read

concurrency:
  group: central-${{ inputs.deployment_id }}
  cancel-in-progress: false

env:
  PLATFORM_API_URL: ${{ vars.API_URL }}

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    outputs:
      execution_id: ${{ steps.prepare.outputs.execution_id }}
      kind: ${{ steps.prepare.outputs.kind }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - id: prepare
        name: Consume authorization and retrieve exact source
        env:
          PLATFORM_AUTHORIZATION: ${{ inputs.platform_authorization }}
        run: python scripts/central_release.py prepare
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.prepare.outputs.kind == 'deploy'
        with:
          name: release-source
          path: release-source.tar.gz
          retention-days: 1
          if-no-files-found: error

  build:
    needs: verify
    if: needs.verify.outputs.kind == 'deploy'
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 30
    environment: build
    permissions:
      contents: read
      id-token: write
    outputs:
      image_digest: ${{ steps.build.outputs.image_digest }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-source
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.CENTRAL_BUILD_WIF_PROVIDER }}
          service_account: ${{ vars.CENTRAL_BUILD_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
      - id: build
        env:
          EXECUTION_ID: ${{ needs.verify.outputs.execution_id }}
        run: python scripts/central_release.py build

  release:
    needs: [verify, build]
    if: always() && needs.verify.result == 'success' && (needs.build.result == 'success' || needs.verify.outputs.kind == 'rollback')
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      # Only trusted engine code runs with deploy credentials; no service checkout.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.CENTRAL_DEPLOY_WIF_PROVIDER }}
          service_account: ${{ vars.CENTRAL_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
      - name: Candidate, smoke, promote and restore on failure
        env:
          EXECUTION_ID: ${{ needs.verify.outputs.execution_id }}
          IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
        run: python scripts/central_release.py release
