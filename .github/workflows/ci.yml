name: API CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e ".[dev]"
      - name: Quality gate
        run: |
          ruff check src tests
          ruff format --check src tests
          mypy src --ignore-missing-imports
          bandit -q -lll -r src
          pip-audit
          pytest -q --cov=eng_platform_api --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=70

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Lint GitHub Actions
        run: docker run --rm -v "${PWD}:/repo" -w /repo rhysd/actionlint:1.7.12 .github/workflows/*.yml templates/github-actions/*.yml examples/caller-workflows/*.yml
      - name: Smoke Service Factory container image
        run: |
          docker build --tag eng-platform-api:ci .
          docker run --detach --rm --name eng-platform-api-ci --publish 8000:8000 eng-platform-api:ci
          trap 'docker stop eng-platform-api-ci' EXIT
          for _ in {1..20}; do curl --fail --silent http://localhost:8000/health && break; sleep 1; done
          curl --fail-with-body --silent --request POST http://localhost:8000/api/service-factory/plan --header 'Content-Type: application/json' --data '{"repository":"test-org/test-repo","service_name":"test-api","service_type":"api","runtime":"python","gcp_project":"test-project","owner":"platform"}' | grep --quiet 'platform_deploy_workflow'

  normalized:
    needs: [quality, workflows]
    uses: ./.github/workflows/reusable-quality-gate.yml
    with:
      service-name: eng-platform-api
      python-version: "3.12"
      lint-command: ruff check src tests
      format-command: ruff format --check src tests
      test-command: python -m pytest -q --cov=eng_platform_api --cov-report=json:quality-reports/coverage.json
      profile: python
      working-directory: .
      coverage-threshold: 70
      platform-ref: ${{ github.sha }}
      platform-api-url: ${{ vars.ENG_PLATFORM_API_URL }}
    secrets:
      QUALITY_API_TOKEN: ${{ secrets.QUALITY_API_TOKEN }}
