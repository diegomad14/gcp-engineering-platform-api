name: API CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    if: ${{ vars.ENG_PLATFORM_RELEASE_ORCHESTRATOR_ENABLED != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e ".[dev]"
      - name: Quality gate
        run: |
          ruff check src tests scripts/release
          ruff format --check src tests scripts/release
          mypy src --ignore-missing-imports
          bandit -q -lll -r src
          pip-audit
          pytest -q --cov=eng_platform_api --cov=scripts.release --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=70

  workflows:
    if: ${{ vars.ENG_PLATFORM_RELEASE_ORCHESTRATOR_ENABLED != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Lint GitHub Actions
        run: docker run --rm -v "${PWD}:/repo" -w /repo rhysd/actionlint:1.7.12 .github/workflows/*.yml templates/github-actions/*.yml examples/caller-workflows/*.yml
      - name: Canonical API container smoke
        env:
          SMOKE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SMOKE_SOURCE_SHA"
          control_dir="$RUNNER_TEMP/canonical-api-smoke"
          mkdir -p "$control_dir"
          git show be74be1958f1604bbd85c5ab29ac5ede9fd78cc0:docker/quality-executor/api_container_smoke.sh > "$control_dir/smoke.sh"
          printf '%s  %s\n' 458dad7ac4518412ef27d00b682b9da958db89aa723bf1b0dd775715482f480d "$control_dir/smoke.sh" | sha256sum --check
          sudo chown -R root:root "$control_dir"
          sudo chmod 0555 "$control_dir" "$control_dir/smoke.sh"
          sudo env GITHUB_RUN_ID="$GITHUB_RUN_ID" bash "$control_dir/smoke.sh" "$GITHUB_WORKSPACE" "$control_dir/report"
          python3 - "$control_dir/report/api-container-smoke.json" > "$RUNNER_TEMP/canonical-smoke-attestation.json" <<'PY'
          import hashlib, json, os, stat, sys
          from pathlib import Path
          report = Path(sys.argv[1])
          directory = report.parent.stat(follow_symlinks=False)
          metadata = report.stat(follow_symlinks=False)
          assert directory.st_uid == metadata.st_uid == 0
          assert stat.S_ISDIR(directory.st_mode) and stat.S_ISREG(metadata.st_mode)
          assert stat.S_IMODE(directory.st_mode) == 0o555
          assert stat.S_IMODE(metadata.st_mode) == 0o444
          payload = json.loads(report.read_text())
          assert payload['schema_version'] == 1 and payload['category'] == 'container_smoke'
          assert payload['status'] == 'PASSED', payload['details']
          assert payload['findings'] == payload['blocking_findings'] == 0
          value = {'repository': os.environ['GITHUB_REPOSITORY'], 'commit_sha': os.environ['SMOKE_SOURCE_SHA'],
                   'workflow_run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                   'report_sha256': hashlib.sha256(report.read_bytes()).hexdigest(), 'report_uid': metadata.st_uid,
                   'report_mode': stat.S_IMODE(metadata.st_mode), 'directory_mode': stat.S_IMODE(directory.st_mode),
                   'wrapper_source_sha': 'be74be1958f1604bbd85c5ab29ac5ede9fd78cc0',
                   'wrapper_sha256': '458dad7ac4518412ef27d00b682b9da958db89aa723bf1b0dd775715482f480d'}
          print(json.dumps(value, sort_keys=True))
          PY
          sudo install -m 0444 "$RUNNER_TEMP/canonical-smoke-attestation.json" "$control_dir/report/attestation.json"
          cat "$control_dir/report/attestation.json"
      - name: Upload canonical smoke evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: canonical-api-smoke-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/canonical-api-smoke/report/
          if-no-files-found: error

  normalized:
    if: ${{ vars.ENG_PLATFORM_RELEASE_ORCHESTRATOR_ENABLED != 'true' }}
    needs: [quality, workflows]
    uses: ./.github/workflows/reusable-quality-gate.yml
    with:
      service-name: eng-platform-api
      python-version: "3.12"
      lint-command: ruff check src tests scripts/release
      format-command: ruff format --check src tests scripts/release
      test-command: python -m pytest -q --cov=eng_platform_api --cov=scripts.release --cov-report=json:quality-reports/coverage.json
      profile: python
      working-directory: .
      coverage-threshold: 70
      platform-ref: ${{ github.sha }}
      platform-api-url: ${{ vars.ENG_PLATFORM_API_URL }}
    secrets:
      QUALITY_API_TOKEN: ${{ secrets.QUALITY_API_TOKEN }}
