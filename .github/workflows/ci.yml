name: API CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Quality gate
        run: |
          ruff check src tests
          ruff format --check src tests
          mypy src --ignore-missing-imports
          bandit -q -lll -r src
          pip-audit
          pytest -q --cov=eng_platform_api --cov-report=term-missing --cov-fail-under=70

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Lint GitHub Actions
        run: docker run --rm -v "${PWD}:/repo" -w /repo rhysd/actionlint:1.7.7 .github/workflows/*.yml templates/github-actions/*.yml examples/caller-workflows/*.yml
