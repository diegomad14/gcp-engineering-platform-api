name: Publish Release Tooling
run-name: eng-platform-tooling-${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      component:
        description: Immutable tooling image set to publish
        required: true
        type: choice
        default: release-executor
        options:
          - release-executor
          - release-planner
          - quality-python
          - quality-go
          - quality
          - all

permissions:
  contents: read
  id-token: write

concurrency:
  group: eng-platform-release-tooling
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GCP_RELEASE_TOOLING_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_RELEASE_TOOLING_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f

      - name: Build and publish immutable tooling images
        env:
          REGISTRY: us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ENG_PLATFORM_TOOLING_REPOSITORY }}
          SOURCE_SHA: ${{ github.sha }}
          COMPONENT: ${{ inputs.component }}
        run: |
          set -euo pipefail
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

          build_and_push() {
            local name="$1"
            local dockerfile="$2"
            local context="${3:-.}"
            local tag="$REGISTRY/$name:$SOURCE_SHA"
            docker build --pull --file "$dockerfile" --tag "$tag" "$context"
            if [[ "$name" == quality-python ]]; then
              python3 docker/quality-executor/smoke_python_isolation.py "$tag"
            fi
            if [[ "$name" == quality-go ]]; then
              python3 docker/quality-executor/smoke_go_isolation.py "$tag"
            fi
            if [[ "$name" == eng-platform-release-executor ]]; then
              local expected_engine actual_engine
              expected_engine="$(sha256sum docker/release-executor/release_executor.py | cut -d' ' -f1)"
              actual_engine="$(docker run --rm --network none --read-only --cap-drop ALL \
                --security-opt no-new-privileges --entrypoint /usr/bin/sha256sum "$tag" \
                /opt/eng-platform/release_executor.py | cut -d' ' -f1)"
              test "$actual_engine" = "$expected_engine"
              docker run --rm --network none --read-only --cap-drop ALL \
                --security-opt no-new-privileges --entrypoint /usr/bin/python3 "$tag" \
                -c 'import runpy, yaml; engine = runpy.run_path("/opt/eng-platform/release_executor.py"); assert callable(engine["runtime_identity_token"])'
              docker run --rm --entrypoint gcloud "$tag" --version >/dev/null
            fi
            if [[ "$name" == quality-python || "$name" == quality-node ]]; then
              local actual_manifest manifest_sha256
              manifest_sha256="$(sha256sum src/eng_platform_api/release_quality_profiles.json | cut -d' ' -f1)"
              actual_manifest="$(docker run --rm --network none --cap-drop ALL \
                --security-opt no-new-privileges --read-only --entrypoint sha256sum \
                "$tag" /opt/eng-platform/release_quality_profiles.json | cut -d' ' -f1)"
              test "$actual_manifest" = "$manifest_sha256"
            fi
            local push_output
            push_output="$(docker push "$tag")"
            printf '%s\n' "$push_output"
            local digest
            digest="$(printf '%s\n' "$push_output" | sed -n 's/^.*digest: \(sha256:[0-9a-f]\{64\}\).*$/\1/p' | tail -n 1)"
            [[ "$digest" == sha256:* ]]
            printf '%s=%s@%s\n' "$name" "$REGISTRY/$name" "$digest" >> "$RUNNER_TEMP/tooling-digests"
          }

          : > "$RUNNER_TEMP/tooling-digests"
          if [[ "$COMPONENT" == all || "$COMPONENT" == quality || \
                "$COMPONENT" == quality-python ]]; then
            build_and_push quality-python docker/quality-executor/Dockerfile.python
          fi
          if [[ "$COMPONENT" == all || "$COMPONENT" == quality || "$COMPONENT" == quality-go ]]; then
            build_and_push quality-go docker/quality-executor/Dockerfile.go
          fi
          if [[ "$COMPONENT" == all || "$COMPONENT" == quality ]]; then
            build_and_push quality-node docker/quality-executor/Dockerfile.node
          fi
          if [[ "$COMPONENT" == all || \
                "$COMPONENT" == quality || \
                "$COMPONENT" == release-planner ]]; then
            build_and_push release-planner docker/release-planner/Dockerfile
          fi
          if [[ "$COMPONENT" == all || "$COMPONENT" == release-executor ]]; then
            build_and_push eng-platform-release-executor \
              docker/release-executor/Dockerfile docker/release-executor
          fi

          manifest_sha256="$(sha256sum src/eng_platform_api/release_quality_profiles.json | cut -d' ' -f1)"
          engine_sha256="$(sha256sum docker/release-executor/release_executor.py | cut -d' ' -f1)"
          printf 'source_sha=%s\ncomponent=%s\nmanifest_sha256=%s\nrelease_executor_sha256=%s\n' \
            "$SOURCE_SHA" "$COMPONENT" "$manifest_sha256" "$engine_sha256" > "$RUNNER_TEMP/tooling-source"

          {
            echo '### Immutable release tooling'
            echo
            echo 'Configure eng-platform with these exact digests:'
            echo '```text'
            cat "$RUNNER_TEMP/tooling-digests"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve immutable tooling publication evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-tooling-${{ github.sha }}-${{ inputs.component }}
          path: |
            ${{ runner.temp }}/tooling-digests
            ${{ runner.temp }}/tooling-source
          if-no-files-found: error
          retention-days: 30
