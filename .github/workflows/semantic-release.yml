name: Semantic Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: semantic-release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.repository != 'diegomad14/gcp-engineering-platform' || !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ${{ (github.ref == 'refs/heads/main' && vars.CGM_ACTIONS_RUNNER == 'cgm-release-local') && vars.CGM_ACTIONS_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Require exact OSS quality evidence
        uses: diegomad14/gcp-engineering-platform-api/.github/actions/verify-quality@fix/oss-release-quality
        with:
          platform-api-url: ${{ vars.ENG_PLATFORM_API_URL }}
          service-name: eng-platform-api
          commit-sha: ${{ github.sha }}
          wait-seconds: '1800'
      - name: Create semantic version tag and GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          npx --yes
          --package semantic-release@25.0.7
          --package @semantic-release/commit-analyzer@13.0.1
          --package @semantic-release/release-notes-generator@14.1.1
          --package @semantic-release/github@12.0.9
          semantic-release
