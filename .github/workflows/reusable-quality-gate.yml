name: Reusable Open Source Quality Gate

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string
      profile:
        required: true
        type: string
      platform-api-url:
        required: true
        type: string
      working-directory:
        required: false
        type: string
        default: "."
      coverage-threshold:
        required: false
        type: number
        default: 70
      python-version:
        required: false
        type: string
        default: "3.11"
      node-version:
        required: false
        type: string
        default: "20"
      install-command:
        required: false
        type: string
        default: ""
      test-command:
        required: false
        type: string
        default: ""
      build-command:
        required: false
        type: string
        default: ""
      lint-command:
        required: false
        type: string
        default: ""
      format-command:
        required: false
        type: string
        default: ""
      typecheck-command:
        required: false
        type: string
        default: ""
      base-sha:
        required: false
        type: string
        default: ""
      platform-ref:
        required: false
        type: string
        default: ""
      runner-label:
        required: false
        type: string
        default: ""
    secrets:
      QUALITY_API_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ${{ inputs.runner-label != '' && inputs.runner-label || 'ubuntu-latest' }}
    steps:
      - name: Checkout service repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

        with:
          fetch-depth: 0

      - name: Checkout quality gate implementation
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: diegomad14/gcp-engineering-platform-api
          ref: ${{ inputs.platform-ref || github.sha }}
          path: .eng-platform

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ inputs.python-version }}

      - name: Isolate quality runner
        run: |
          cp .eng-platform/scripts/quality/*.py "$RUNNER_TEMP/"
          rm -rf .eng-platform

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: ${{ inputs.profile == 'node' || inputs.profile == 'static' }}
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          cache: true

      - name: Install quality tools
        run: python -m pip install --disable-pip-version-check ruff semgrep pytest-cov

      - name: Run quality gate
        id: gate
        continue-on-error: true
        env:
          RUN_INPUTS_SERVICE_NAME: ${{ inputs.service-name }}
          RUN_GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_GITHUB_SHA: ${{ github.sha }}
          RUN_GITHUB_REF_NAME: ${{ github.ref_name }}
          RUN_INPUTS_PROFILE: ${{ inputs.profile }}
          RUN_INPUTS_WORKING_DIRECTORY: ${{ inputs.working-directory }}
          RUN_INPUTS_COVERAGE_THRESHOLD: ${{ inputs.coverage-threshold }}
          RUN_GITHUB_SERVER_URL: ${{ github.server_url }}
          RUN_GITHUB_RUN_ID: ${{ github.run_id }}
          QUALITY_BASE_SHA: ${{ inputs.base-sha }}
          INSTALL_COMMAND: ${{ inputs.install-command }}
          TEST_COMMAND: ${{ inputs.test-command }}
          BUILD_COMMAND: ${{ inputs.build-command }}
          LINT_COMMAND: ${{ inputs.lint-command }}
          FORMAT_COMMAND: ${{ inputs.format-command }}
          TYPECHECK_COMMAND: ${{ inputs.typecheck-command }}
        run: |
          set -o pipefail
          ARGS=(
            --base-sha "$QUALITY_BASE_SHA"
            --service-name "${RUN_INPUTS_SERVICE_NAME}"
            --repository "${RUN_GITHUB_REPOSITORY}"
            --commit-sha "${RUN_GITHUB_SHA}"
            --branch "${RUN_GITHUB_REF_NAME}"
            --profile "${RUN_INPUTS_PROFILE}"
            --working-directory "${RUN_INPUTS_WORKING_DIRECTORY}"
            --coverage-threshold "${RUN_INPUTS_COVERAGE_THRESHOLD}"
            --workflow-run-url "${RUN_GITHUB_SERVER_URL}/${RUN_GITHUB_REPOSITORY}/actions/runs/${RUN_GITHUB_RUN_ID}"
            --output "$GITHUB_WORKSPACE/quality-report.json"
          )
          [ -z "$INSTALL_COMMAND" ] || ARGS+=(--install-command "$INSTALL_COMMAND")
          [ -z "$TEST_COMMAND" ] || ARGS+=(--test-command "$TEST_COMMAND")
          [ -z "$BUILD_COMMAND" ] || ARGS+=(--build-command "$BUILD_COMMAND")
          [ -z "$LINT_COMMAND" ] || ARGS+=(--lint-command "$LINT_COMMAND")
          [ -z "$FORMAT_COMMAND" ] || ARGS+=(--format-command "$FORMAT_COMMAND")
          [ -z "$TYPECHECK_COMMAND" ] || ARGS+=(--typecheck-command "$TYPECHECK_COMMAND")
          python "$RUNNER_TEMP/quality_gate.py" "${ARGS[@]}"

      - name: Publish normalized report
        env:
          PLATFORM_API_URL: ${{ inputs.platform-api-url }}
          QUALITY_API_TOKEN: ${{ secrets.QUALITY_API_TOKEN }}
        run: |
          curl --fail-with-body --retry 3 -X POST \
            "$PLATFORM_API_URL/api/quality/reports" \
            -H "Authorization: Bearer $QUALITY_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @quality-report.json

      - name: Write job summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          report = json.loads(Path("quality-report.json").read_text())
          failed = any(check["status"] == "FAILED" for check in report["checks"])
          print(f"## Quality Gate: {'FAILED' if failed else 'PASSED'}")
          print()
          print(f"- Service: `{report['service_name']}`")
          print(f"- Commit: `{report['commit_sha']}`")
          print(f"- Coverage: `{report['coverage']}`")
          print()
          print("| Check | Status | Findings |")
          print("|---|---:|---:|")
          for check in report["checks"]:
              print(f"| {check['name']} | {check['status']} | {check['findings']} |")
          PY

      - name: Upload quality artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quality-${{ inputs.service-name }}-${{ github.sha }}
          path: |
            quality-report.json
            ${{ inputs.working-directory }}/quality-reports/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce quality gate
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("quality-report.json").read_text())
          failed = [check["name"] for check in report["checks"] if check["status"] == "FAILED"]
          if failed:
              raise SystemExit("Quality gate failed: " + ", ".join(failed))
          PY
