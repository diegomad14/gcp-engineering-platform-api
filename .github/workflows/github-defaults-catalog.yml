name: Managed services GitHub defaults catalog activation
run-name: Managed services GitHub defaults catalog ${{ inputs.mode }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect first, then activate the exact inspected candidate
        required: true
        type: choice
        options: [inspect, activate]
      candidate_sha256:
        description: Exact candidate SHA256 returned by inspection (activation only)
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: reconnections-catalog-maintenance
  cancel-in-progress: false

jobs:
  activate:
    if: ${{ github.repository == 'diegomad14/gcp-engineering-platform-api' && github.ref == 'refs/heads/main' && github.actor_id == '97854332' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require exact OSS quality evidence
        uses: ./.github/actions/verify-quality
        with:
          platform-api-url: ${{ vars.ENG_PLATFORM_API_URL }}
          service-name: eng-platform-api
          commit-sha: ${{ github.sha }}
          wait-seconds: '0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install reviewed validation dependencies
        run: python -m pip install -e '.[dev]'
      - name: Require coverage of the full approved catalog change before cloud authentication
        env:
          SCOPED_REPORT_DIR: ${{ runner.temp }}/github-defaults-scoped-quality
          APPROVED_BASE_SHA: 205f43f6598570cccd46b404e035538850172ab5
        run: |
          set -euo pipefail
          mkdir -p "$SCOPED_REPORT_DIR"
          python -m pytest -q --cov=eng_platform_api --cov=scripts.release \
            --cov-report="json:$SCOPED_REPORT_DIR/coverage.json" --cov-fail-under=70
          python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.quality.differential_coverage import differential
          directory = Path(os.environ['SCOPED_REPORT_DIR'])
          report = differential(Path.cwd(), directory, 'python', os.environ['APPROVED_BASE_SHA'], os.environ['GITHUB_SHA'])
          assert report['policy_version'] == 'oss-v2' and report['changed_lines'] > 0
          assert report['differential_coverage'] >= report['differential_threshold'] == 80
          report.update(commit_sha=os.environ['GITHUB_SHA'], repository=os.environ['GITHUB_REPOSITORY'], quality_gate_status='PASSED')
          (directory / 'github-defaults-catalog-differential.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, sort_keys=True))
          PY
      - name: Check existing federation identity
        env:
          EXISTING_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          EXISTING_ACCOUNT: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test "$EXISTING_PROVIDER" = projects/546821492326/locations/global/workloadIdentityPools/cgm-github-pool/providers/cgm-github-oidc
          test "$EXISTING_ACCOUNT" = cgm-sanplat-deployer@cgm-assistant-prod.iam.gserviceaccount.com
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
      - name: Inspect or activate only seven release and fifteen deployment defaults
        env:
          CGM_ACTIVATION_REPORT: ${{ runner.temp }}/github-defaults-catalog.json
          CATALOG_MODE: ${{ inputs.mode }}
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
        run: python -m scripts.github_defaults_catalog --mode "$CATALOG_MODE" --candidate-sha256 "$CANDIDATE_SHA256"
      - name: Upload only the bounded non-secret audit
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: github-defaults-catalog-${{ inputs.mode }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/github-defaults-catalog.json
            ${{ runner.temp }}/github-defaults-scoped-quality/github-defaults-catalog-differential.json
          if-no-files-found: ignore
