name: Platform Rollback
run-name: eng-platform-rollback-${{ inputs.github_deployment_id }}

on:
  workflow_dispatch:
    inputs:
      service_name: {required: true, type: string}
      target_tag: {required: true, type: string}
      target_revision: {required: true, type: string}
      github_deployment_id: {required: true, type: string}
      project_id: {required: true, type: string}
      region: {required: true, type: string}
      health_path: {required: true, type: string}
      target_sha: {required: true, type: string}
      platform_authorization: {required: true, type: string}
      execution_config: {required: false, type: string, default: '{}'}
      profile_sha256: {required: true, type: string}

permissions: {contents: read, deployments: write, id-token: write}

concurrency:
  group: deploy-${{ inputs.service_name }}
  cancel-in-progress: false

jobs:
  rollback:
    if: ${{ !startsWith(inputs.service_name, 'cgm-artemis-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate release executor configuration
        env:
          RELEASE_EXECUTOR_IMAGE: ${{ vars.ENG_PLATFORM_RELEASE_EXECUTOR_IMAGE }}
          PLATFORM_API_URL: ${{ vars.ENG_PLATFORM_API_URL }}
          RELEASE_SIGNING_PUBLIC_KEY: ${{ vars.ENG_PLATFORM_RELEASE_SIGNING_PUBLIC_KEY }}
          RELEASE_WIF_PROVIDER: ${{ vars.GCP_RELEASE_WIF_PROVIDER }}
          RELEASE_SERVICE_ACCOUNT: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_EXECUTOR_IMAGE" =~ ^[^[:space:]@]+@sha256:[0-9a-f]{64}$ ]] || {
            echo 'Release executor must be pinned by a complete SHA-256 digest' >&2
            exit 1
          }
          [[ "$PLATFORM_API_URL" == https://* ]] || {
            echo 'Engineering Platform API URL must use HTTPS' >&2
            exit 1
          }
          for name in RELEASE_SIGNING_PUBLIC_KEY RELEASE_WIF_PROVIDER RELEASE_SERVICE_ACCOUNT; do
            test -n "${!name}" || { echo "Required release configuration is missing: $name" >&2; exit 1; }
          done
      - name: Validate bounded runtime execution configuration
        env:
          RELEASE_SERVICE: ${{ inputs.service_name }}
          EXECUTION_CONFIG: ${{ inputs.execution_config }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_SERVICE" != cgm-artemis-* ]]; then
            jq -se 'length == 1 and (.[0] | type == "object" and length == 0)' \
              <<<"$EXECUTION_CONFIG" >/dev/null
            exit 0
          fi
          jq -se --arg service "$RELEASE_SERVICE" '
            def safe_string($pattern):
              type == "string" and test($pattern) and (test("[[:cntrl:]]") | not);
            def safe_list($pattern):
              type == "array" and all(.[]; safe_string($pattern));
            length == 1 and (.[0] |
              type == "object"
              and keys == ["dockerfile_path", "evidence_bucket", "paired_web_sha",
                           "private_runtime", "quality_evidence_services",
                           "repository_aliases", "runtime_kind"]
              and (.runtime_kind == "cloud_run_service" or .runtime_kind == "cloud_run_job")
              and (.evidence_bucket | safe_string("^[a-z0-9][a-z0-9._-]{2,222}$"))
              and (.private_runtime | type == "boolean")
              and (.dockerfile_path |
                   safe_string("^[A-Za-z0-9_./-]+$")
                   and (startswith("/") | not)
                   and (split("/") | all(. != "..")))
              and (.quality_evidence_services | safe_list("^[a-z][a-z0-9-]*$"))
              and (.repository_aliases | safe_list("^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$"))
              and (.paired_web_sha | safe_string("^([0-9a-f]{40})?$"))
              and ($service != "cgm-artemis-api" or (.paired_web_sha | length == 40))
            )' <<<"$EXECUTION_CONFIG" >/dev/null
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.target_tag }}
      - name: Verify immutable rollback source
        id: release
        env:
          EXPECTED_SHA: ${{ inputs.target_sha }}
          DEPLOYMENT_ID: ${{ inputs.github_deployment_id }}
          TARGET_TAG: ${{ inputs.target_tag }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          fingerprint="$(printf '%s' "$DEPLOYMENT_ID|${GITHUB_REPOSITORY}|$TARGET_TAG|$EXPECTED_SHA|rollback" | sha256sum | cut -d' ' -f1)"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Verify Engineering Platform authorization
        uses: ./.github/actions/verify-release-authorization
        with:
          token: ${{ inputs.platform_authorization }}
          repository: ${{ github.repository }}
          service_name: ${{ inputs.service_name }}
          tag: ${{ inputs.target_tag }}
          sha: ${{ inputs.target_sha }}
          github_deployment_id: ${{ inputs.github_deployment_id }}
          kind: rollback
          target_revision: ${{ inputs.target_revision }}
          platform_api_url: ${{ vars.ENG_PLATFORM_API_URL }}
          signing_public_key: ${{ vars.ENG_PLATFORM_RELEASE_SIGNING_PUBLIC_KEY }}
      - name: Bind verified runtime execution configuration
        env:
          RELEASE_SERVICE: ${{ inputs.service_name }}
          EXECUTION_CONFIG: ${{ inputs.execution_config }}
          EXECUTION_AUTHORIZATION: ${{ inputs.platform_authorization }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_SERVICE" != cgm-artemis-* ]]; then
            exit 0
          fi
          # The preceding pinned action verified this ticket's signature and identity.
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import sys

          canonical = json.dumps(
              json.loads(os.environ["EXECUTION_CONFIG"]),
              sort_keys=True, separators=(",", ":"), ensure_ascii=True,
          ).encode("ascii")
          expected = hashlib.sha256(canonical).hexdigest()
          parts = os.environ["EXECUTION_AUTHORIZATION"].split(".")
          try:
              if len(parts) != 3:
                  raise ValueError("Malformed ticket")
              payload = parts[1] + "=" * (-len(parts[1]) % 4)
              claims = json.loads(base64.urlsafe_b64decode(payload))
          except (ValueError, TypeError):
              sys.exit("Verified ticket configuration is unavailable")
          if claims.get("configuration_hash") != expected:
              sys.exit("Runtime configuration does not match the verified platform ticket")
          PY
          jq -r '
            ["CGM_RUNTIME_KIND=" + .runtime_kind,
             "CGM_EVIDENCE_BUCKET=" + .evidence_bucket,
             "CGM_PRIVATE_RUNTIME=" + (.private_runtime | tostring),
             "CGM_DOCKERFILE_PATH=" + .dockerfile_path,
             "CGM_QUALITY_EVIDENCE_SERVICES=" + (.quality_evidence_services | join(",")),
             "CGM_REPOSITORY_ALIASES=" + (.repository_aliases | join(",")),
             "CGM_PAIRED_WEB_SHA=" + .paired_web_sha] | .[]
          ' <<<"$EXECUTION_CONFIG" >> "$GITHUB_ENV"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GCP_RELEASE_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
      - name: Run the pinned traffic-only recovery engine
        env:
          RELEASE_EXECUTOR_IMAGE: ${{ vars.ENG_PLATFORM_RELEASE_EXECUTOR_IMAGE }}
          CGM_SERVICE: ${{ inputs.service_name }}
          CGM_RELEASE_TAG: ${{ inputs.target_tag }}
          CGM_RELEASE_SHA: ${{ inputs.target_sha }}
          CGM_PROJECT_ID: ${{ inputs.project_id }}
          CGM_REGION: ${{ inputs.region }}
          CGM_HEALTH_PATH: ${{ inputs.health_path }}
          CGM_DEPLOYMENT_ID: ${{ inputs.github_deployment_id }}
          CGM_OPERATION: rollback
          CGM_TARGET_REVISION: ${{ inputs.target_revision }}
          CGM_REPOSITORY: ${{ github.repository }}
          CGM_REQUEST_FINGERPRINT: ${{ steps.release.outputs.fingerprint }}
          CGM_PROFILE: ${{ inputs.service_name }}
          CGM_PROFILE_SHA256: ${{ inputs.profile_sha256 }}
          CGM_PLATFORM_API_URL: ${{ vars.ENG_PLATFORM_API_URL }}
        run: |
          set -euo pipefail
          gcloud auth configure-docker "$CGM_REGION-docker.pkg.dev" --quiet
          credential_file="$(basename "$GOOGLE_APPLICATION_CREDENTIALS")"
          docker run --rm --network host \
            --volume "$PWD:/workspace" --volume /var/run/docker.sock:/var/run/docker.sock \
            --user "$(id -u):$(id -g)" --group-add "$(stat -c %g /var/run/docker.sock)" \
            --env HOME=/tmp --env CLOUDSDK_CONFIG=/tmp/gcloud \
            --workdir /workspace --env GOOGLE_APPLICATION_CREDENTIALS="/workspace/$credential_file" \
            --env CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE="/workspace/$credential_file" \
            --env CGM_SERVICE --env CGM_RELEASE_TAG --env CGM_RELEASE_SHA \
            --env CGM_PROJECT_ID --env CGM_REGION --env CGM_HEALTH_PATH \
            --env CGM_DEPLOYMENT_ID --env CGM_OPERATION --env CGM_TARGET_REVISION \
            --env CGM_REPOSITORY --env CGM_REQUEST_FINGERPRINT --env CGM_PROFILE \
            --env CGM_PROFILE_SHA256 \
            --env CGM_PLATFORM_API_URL \
            --env CGM_RUNTIME_KIND --env CGM_EVIDENCE_BUCKET --env CGM_PRIVATE_RUNTIME \
            --env CGM_DOCKERFILE_PATH --env CGM_QUALITY_EVIDENCE_SERVICES \
            --env CGM_REPOSITORY_ALIASES --env CGM_PAIRED_WEB_SHA \
            "$RELEASE_EXECUTOR_IMAGE" --service "$CGM_SERVICE"
      - name: Publish rollback result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOYMENT_ID: ${{ inputs.github_deployment_id }}
          JOB_STATUS: ${{ job.status }}
          TARGET_REVISION: ${{ inputs.target_revision }}
        run: |
          state=$([ "$JOB_STATUS" = success ] && echo success || echo failure)
          gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$DEPLOYMENT_ID/statuses" \
            -f state="$state" \
            -f description="production_revision=$TARGET_REVISION" \
            -f log_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
  verify-release:
    if: ${{ startsWith(inputs.service_name, 'cgm-artemis-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      sha: ${{ inputs.target_sha }}
      executor_image: ${{ steps.executor.outputs.image }}
    steps:
    - name: Validate release executor configuration
      env:
        RELEASE_EXECUTOR_IMAGE: ${{ vars.ENG_PLATFORM_RELEASE_EXECUTOR_IMAGE }}
        PLATFORM_API_URL: ${{ vars.ENG_PLATFORM_API_URL }}
        RELEASE_SIGNING_PUBLIC_KEY: ${{ vars.ENG_PLATFORM_RELEASE_SIGNING_PUBLIC_KEY }}
        RELEASE_WIF_PROVIDER: ${{ vars.GCP_RELEASE_WIF_PROVIDER }}
        RELEASE_SERVICE_ACCOUNT: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}
      run: |
        set -euo pipefail
        [[ "$RELEASE_EXECUTOR_IMAGE" =~ ^[^[:space:]@]+@sha256:[0-9a-f]{64}$ ]] || {
          echo 'Release executor must be pinned by a complete SHA-256 digest' >&2
          exit 1
        }
        [[ "$PLATFORM_API_URL" == https://* ]] || {
          echo 'Engineering Platform API URL must use HTTPS' >&2
          exit 1
        }
        for name in RELEASE_SIGNING_PUBLIC_KEY RELEASE_WIF_PROVIDER RELEASE_SERVICE_ACCOUNT; do
          test -n "${!name}" || { echo "Required release configuration is missing: $name" >&2; exit 1; }
        done
        echo "image=$RELEASE_EXECUTOR_IMAGE" >> "$GITHUB_OUTPUT"
      id: executor
    - name: Validate bounded runtime execution configuration
      env:
        RELEASE_SERVICE: ${{ inputs.service_name }}
        EXECUTION_CONFIG: ${{ inputs.execution_config }}
      run: |
        set -euo pipefail
        if [[ "$RELEASE_SERVICE" != cgm-artemis-* ]]; then
          jq -se 'length == 1 and (.[0] | type == "object" and length == 0)' \
            <<<"$EXECUTION_CONFIG" >/dev/null
          exit 0
        fi
        jq -se --arg service "$RELEASE_SERVICE" '
          def safe_string($pattern):
            type == "string" and test($pattern) and (test("[[:cntrl:]]") | not);
          def safe_list($pattern):
            type == "array" and all(.[]; safe_string($pattern));
          length == 1 and (.[0] |
            type == "object"
            and keys == ["dockerfile_path", "evidence_bucket", "paired_web_sha",
                         "private_runtime", "quality_evidence_services",
                         "repository_aliases", "runtime_kind"]
            and (.runtime_kind == "cloud_run_service" or .runtime_kind == "cloud_run_job")
            and (.evidence_bucket | safe_string("^[a-z0-9][a-z0-9._-]{2,222}$"))
            and (.private_runtime | type == "boolean")
            and (.dockerfile_path |
                 safe_string("^[A-Za-z0-9_./-]+$")
                 and (startswith("/") | not)
                 and (split("/") | all(. != "..")))
            and (.quality_evidence_services | safe_list("^[a-z][a-z0-9-]*$"))
            and (.repository_aliases | safe_list("^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$"))
            and (.paired_web_sha | safe_string("^([0-9a-f]{40})?$"))
            and ($service != "cgm-artemis-api" or (.paired_web_sha | length == 40))
          )' <<<"$EXECUTION_CONFIG" >/dev/null
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        ref: ${{ inputs.target_tag }}
    - name: Verify immutable rollback source
      id: release
      env:
        EXPECTED_SHA: ${{ inputs.target_sha }}
        DEPLOYMENT_ID: ${{ inputs.github_deployment_id }}
        TARGET_TAG: ${{ inputs.target_tag }}
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
        fingerprint="$(printf '%s' "$DEPLOYMENT_ID|${GITHUB_REPOSITORY}|$TARGET_TAG|$EXPECTED_SHA|rollback" | sha256sum | cut -d' ' -f1)"
        echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
    - name: Verify Engineering Platform authorization
      uses: ./.github/actions/verify-release-authorization
      with:
        token: ${{ inputs.platform_authorization }}
        repository: ${{ github.repository }}
        service_name: ${{ inputs.service_name }}
        tag: ${{ inputs.target_tag }}
        sha: ${{ inputs.target_sha }}
        github_deployment_id: ${{ inputs.github_deployment_id }}
        kind: rollback
        target_revision: ${{ inputs.target_revision }}
        platform_api_url: ${{ vars.ENG_PLATFORM_API_URL }}
        signing_public_key: ${{ vars.ENG_PLATFORM_RELEASE_SIGNING_PUBLIC_KEY }}
    - name: Bind verified runtime execution configuration
      env:
        RELEASE_SERVICE: ${{ inputs.service_name }}
        EXECUTION_CONFIG: ${{ inputs.execution_config }}
        EXECUTION_AUTHORIZATION: ${{ inputs.platform_authorization }}
      run: |
