name: Build Local Runner Image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-local-runner-image
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install image tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            jq qemu-utils
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: 1.3.3
      - name: Build and validate approved image
        id: image
        run: |
          set -euo pipefail
          IMAGE="$RUNNER_TEMP/cgm-release-local-ubuntu-24.04-amd64.qcow2"
          ./scripts/ops/local-release-runner/build-image.sh "$IMAGE"
          qemu-img check "$IMAGE"
          SHA256=$(sha256sum "$IMAGE" | awk '{print $1}')
          echo "path=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
      - name: Publish immutable OCI artifact
        id: publish
        env:
          RUN_GITHUB_ACTOR: ${{ github.actor }}
          RUN_GITHUB_SERVER_URL: ${{ github.server_url }}
          RUN_GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_GITHUB_SHA: ${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_PATH: ${{ steps.image.outputs.path }}
        run: |
          set -euo pipefail
          REFERENCE="ghcr.io/diegomad14/cgm-release-runner-image"
          TAG="ubuntu-20260814-runner-2.337.0"
          MEDIA_TYPE="application/vnd.cgm.release-runner.qcow2"
          echo "$GHCR_TOKEN" | oras login ghcr.io --username "${RUN_GITHUB_ACTOR}" --password-stdin
          # Push from the image directory so the layer is stored under its
          # basename (the filename pinned in approved-artifacts.json and
          # expected by fetch-image.sh), not the absolute runner temp path.
          pushd "$(dirname "$IMAGE_PATH")" >/dev/null
          oras push "$REFERENCE:$TAG" \
            "$(basename "$IMAGE_PATH"):$MEDIA_TYPE" \
            --annotation "org.opencontainers.image.source=${RUN_GITHUB_SERVER_URL}/${RUN_GITHUB_REPOSITORY}" \
            --annotation "org.opencontainers.image.revision=${RUN_GITHUB_SHA}" \
            --annotation "org.opencontainers.image.version=$TAG"
          popd >/dev/null
          DIGEST=$(oras resolve "$REFERENCE:$TAG")
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Publish approval evidence
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
          IMAGE_SHA256: ${{ steps.image.outputs.sha256 }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          {
            echo "## Local runner image"
            echo
            echo "- Reference: \`ghcr.io/diegomad14/cgm-release-runner-image\`"
            echo "- Tag: \`ubuntu-20260814-runner-2.337.0\`"
            echo "- OCI digest: \`$IMAGE_DIGEST\`"
            echo "- QCOW2 SHA-256: \`$IMAGE_SHA256\`"
            echo "- Source revision: \`$SOURCE_REVISION\`"
          } >> "$GITHUB_STEP_SUMMARY"
