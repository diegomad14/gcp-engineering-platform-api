name: Bootstrap Platform Runtime

# One-time migration path for the control plane itself. After the signed
# release workflow is live, remove the legacy WIF binding and this workflow
# fails closed without creating another deployment path.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable semantic release tag to bootstrap
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: cgm-assistant-prod
  REGION: us-central1
  SERVICE_NAME: eng-platform-api
  IMAGE_NAME: eng-platform-api
  ARTIFACT_REPOSITORY: cgm-sanplat-repo
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  bootstrap:
    name: Bootstrap control plane runtime
    if: ${{ github.actor == 'diegomad14' }}
    runs-on: ubuntu-latest
    environment: platform-bootstrap
    outputs:
      previous_revision: ${{ steps.snapshot.outputs.previous_revision }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 1
      - name: Validate bootstrap release
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]
          test -n "${{ vars.GCP_WIF_PROVIDER }}"
          test -n "${{ vars.GCP_WIF_SERVICE_ACCOUNT }}"
          test -n "${{ vars.ENG_PLATFORM_ALLOWED_GITHUB_LOGINS }}"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
      - name: Authenticate Docker to Artifact Registry
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
      - name: Build and push immutable image
        run: |
          set -euo pipefail
          image="$REGION-docker.pkg.dev/$PROJECT_ID/$ARTIFACT_REPOSITORY/$IMAGE_NAME:$RELEASE_TAG"
          docker build --tag "$image" .
          docker push "$image"
      - name: Snapshot current production revision
        id: snapshot
        run: |
          set -euo pipefail
          previous="$(gcloud run services describe "$SERVICE_NAME" --project="$PROJECT_ID" --region="$REGION" --format='value(status.traffic[0].revisionName)')"
          test -n "$previous"
          echo "previous_revision=$previous" >> "$GITHUB_OUTPUT"
      - name: Deploy zero-traffic bootstrap candidate
        run: |
          set -euo pipefail
          image="$REGION-docker.pkg.dev/$PROJECT_ID/$ARTIFACT_REPOSITORY/$IMAGE_NAME:$RELEASE_TAG"
          gcloud run deploy "$SERVICE_NAME" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --image="$image" \
            --no-traffic \
            --update-env-vars="ENG_PLATFORM_MOCK_MODE=false,ENG_PLATFORM_GITHUB_ENABLED=true,ENG_PLATFORM_API_URL=${{ vars.ENG_PLATFORM_API_URL }},ENG_PLATFORM_FRONTEND_URL=${{ vars.ENG_PLATFORM_FRONTEND_URL }},ENG_PLATFORM_ALLOWED_GITHUB_LOGINS=${{ vars.ENG_PLATFORM_ALLOWED_GITHUB_LOGINS }},CGM_ACTIONS_RUNNER=${{ vars.CGM_ACTIONS_RUNNER }},ENG_PLATFORM_TRUST_IAP_IDENTITY=false,ENG_PLATFORM_RELEASE_AUTH_FIRESTORE_COLLECTION=release_authorizations" \
            --update-secrets="ENG_PLATFORM_GITHUB_TOKEN=eng-platform-github-token:latest,ENG_PLATFORM_GITHUB_OAUTH_CLIENT_ID=eng-platform-oauth-client-id:latest,ENG_PLATFORM_GITHUB_OAUTH_CLIENT_SECRET=eng-platform-github-oauth-client-secret:latest,ENG_PLATFORM_SESSION_SECRET=eng-platform-session-secret:latest,ENG_PLATFORM_RELEASE_SIGNING_PRIVATE_KEY=eng-platform-release-signing-private-key:latest" \
            --quiet
      - name: Smoke bootstrap candidate
        run: |
          set -euo pipefail
          revision="$(gcloud run services describe "$SERVICE_NAME" --project="$PROJECT_ID" --region="$REGION" --format='value(status.latestCreatedRevisionName)')"
          test -n "$revision"
          tag="bootstrap-$GITHUB_RUN_ID"
          gcloud run services update-traffic "$SERVICE_NAME" --project="$PROJECT_ID" --region="$REGION" --set-tags="$tag=$revision" --quiet
          url="$(gcloud run services describe "$SERVICE_NAME" --project="$PROJECT_ID" --region="$REGION" --format=json | python3 -c 'import json,sys; d=json.load(sys.stdin); tag=sys.argv[1]; print(next((r.get("url","") for r in d.get("status",{}).get("traffic",[]) if r.get("tag")==tag or r.get("tagName")==tag), ""))' "$tag")"
          test -n "$url"
          curl --fail-with-body --retry 5 --retry-all-errors "$url/health"
      - name: Promote bootstrap candidate
        run: |
          set -euo pipefail
          revision="$(gcloud run services describe "$SERVICE_NAME" --project="$PROJECT_ID" --region="$REGION" --format='value(status.latestCreatedRevisionName)')"
          gcloud run services update-traffic "$SERVICE_NAME" --project="$PROJECT_ID" --region="$REGION" --to-revisions="$revision=100" --quiet
          url="$(gcloud run services describe "$SERVICE_NAME" --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)')"
          curl --fail-with-body --retry 5 --retry-all-errors "$url/health"

  rollback:
    name: Roll back failed bootstrap
    if: ${{ always() && needs.bootstrap.result == 'failure' && needs.bootstrap.outputs.previous_revision != '' }}
    needs: bootstrap
    runs-on: ubuntu-latest
    environment: platform-bootstrap
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
      - name: Restore previous revision
        run: gcloud run services update-traffic "$SERVICE_NAME" --project="$PROJECT_ID" --region="$REGION" --to-revisions="${{ needs.bootstrap.outputs.previous_revision }}=100" --quiet
