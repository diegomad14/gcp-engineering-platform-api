name: Bootstrap Platform Runtime

# One-time migration path for the control plane itself. After the signed
# release workflow is live, remove the legacy WIF binding and this workflow
# fails closed without creating another deployment path.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable semantic release tag to bootstrap
        required: true
        type: string

permissions:
  contents: read
  checks: read
  id-token: write

concurrency:
  group: deploy-eng-platform-api
  cancel-in-progress: false

env:
  PROJECT_ID: cgm-assistant-prod
  REGION: us-central1
  SERVICE_NAME: eng-platform-api
  IMAGE_NAME: eng-platform-api
  ARTIFACT_REPOSITORY: cgm-sanplat-repo
  RELEASE_TAG: ${{ inputs.tag }}
  PLATFORM_API_URL: ${{ vars.ENG_PLATFORM_API_URL }}
  PLATFORM_FRONTEND_URL: ${{ vars.ENG_PLATFORM_FRONTEND_URL }}
  ALLOWED_LOGINS: ${{ vars.ENG_PLATFORM_ALLOWED_GITHUB_LOGINS }}
  APP_ID: ${{ vars.ENG_PLATFORM_GITHUB_APP_ID }}
  INSTALLATION_ID: ${{ vars.ENG_PLATFORM_GITHUB_INSTALLATION_ID }}

jobs:
  bootstrap:
    name: Bootstrap control plane runtime
    if: ${{ github.actor == 'diegomad14' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: platform-bootstrap
    outputs:
      previous_revision: ${{ steps.snapshot.outputs.previous_revision }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 1
      - name: Validate bootstrap release
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]
          test -n "${{ vars.GCP_WIF_PROVIDER }}"
          test -n "${{ vars.GCP_WIF_SERVICE_ACCOUNT }}"
          [[ "$ALLOWED_LOGINS" =~ ^[A-Za-z0-9,-]+$ ]]
          [[ "$APP_ID" =~ ^[0-9]+$ ]]
          [[ "$INSTALLATION_ID" =~ ^[0-9]+$ ]]
      - name: Require successful checks on exact source commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs" --paginate \
            --jq '.check_runs[] | [.name,.conclusion] | @tsv' > "$RUNNER_TEMP/checks.tsv"
          for check in quality workflows; do
            awk -F '\t' -v required="$check" '$1 == required && $2 == "success" {found=1} END {exit !found}' "$RUNNER_TEMP/checks.tsv"
          done
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
      - name: Authenticate Docker to Artifact Registry
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
      - name: Build and push immutable image
        id: image
        run: |
          set -euo pipefail
          image="$REGION-docker.pkg.dev/$PROJECT_ID/$ARTIFACT_REPOSITORY/$IMAGE_NAME:$RELEASE_TAG"
          docker build --tag "$image" .
          docker push "$image"
          digest="$(docker inspect "$image" --format='{{index .RepoDigests 0}}')"
          [[ "$digest" == *@sha256:* ]]
          echo "image=$digest" >> "$GITHUB_OUTPUT"
      - name: Snapshot current production revision
        id: snapshot
        run: |
          set -euo pipefail
          previous="$(gcloud run services describe "$SERVICE_NAME" --project="$PROJECT_ID" --region="$REGION" --format=json | python3 -c 'import json,sys; traffic=json.load(sys.stdin)["status"]["traffic"]; print(next((r["revisionName"] for r in traffic if r.get("percent")==100), ""))')"
          test -n "$previous"
          echo "previous_revision=$previous" >> "$GITHUB_OUTPUT"
      - name: Deploy zero-traffic bootstrap candidate
        id: candidate
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          suffix="b${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gcloud run deploy "$SERVICE_NAME" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --image="$IMAGE_DIGEST" \
            --revision-suffix="$suffix" \
            --service-account="eng-platform-runtime@$PROJECT_ID.iam.gserviceaccount.com" \
            --no-traffic \
            --update-env-vars="^|^ENG_PLATFORM_MOCK_MODE=false|ENG_PLATFORM_GITHUB_ENABLED=true|ENG_PLATFORM_API_URL=$PLATFORM_API_URL|ENG_PLATFORM_FRONTEND_URL=$PLATFORM_FRONTEND_URL|ENG_PLATFORM_ALLOWED_GITHUB_LOGINS=$ALLOWED_LOGINS|ENG_PLATFORM_GITHUB_APP_ID=$APP_ID|ENG_PLATFORM_GITHUB_INSTALLATION_ID=$INSTALLATION_ID|ENG_PLATFORM_TRUST_IAP_IDENTITY=false|ENG_PLATFORM_RELEASE_AUTH_FIRESTORE_COLLECTION=release_authorizations|ENG_PLATFORM_GCP_PROJECT_ID=$PROJECT_ID" \
            --update-secrets="ENG_PLATFORM_GITHUB_TOKEN=eng-platform-github-token:latest,ENG_PLATFORM_GITHUB_OAUTH_CLIENT_ID=eng-platform-oauth-client-id:latest,ENG_PLATFORM_GITHUB_OAUTH_CLIENT_SECRET=eng-platform-oauth-client-secret:latest,ENG_PLATFORM_SESSION_SECRET=eng-platform-session-secret:latest,ENG_PLATFORM_RELEASE_SIGNING_PRIVATE_KEY=eng-platform-release-signing-private-key:latest,ENG_PLATFORM_GITHUB_PRIVATE_KEY=eng-platform-github-private-key:1" \
            --quiet
          echo "revision=$SERVICE_NAME-$suffix" >> "$GITHUB_OUTPUT"
      - name: Smoke bootstrap candidate
        env:
          REVISION: ${{ steps.candidate.outputs.revision }}
        run: |
          set -euo pipefail
          revision="$REVISION"
          test -n "$revision"
          tag="bootstrap-$GITHUB_RUN_ID"
          gcloud run services update-traffic "$SERVICE_NAME" --project="$PROJECT_ID" --region="$REGION" --update-tags="$tag=$revision" --quiet
          url="$(gcloud run services describe "$SERVICE_NAME" --project="$PROJECT_ID" --region="$REGION" --format=json | python3 -c 'import json,sys; d=json.load(sys.stdin); tag=sys.argv[1]; print(next((r.get("url","") for r in d.get("status",{}).get("traffic",[]) if r.get("tag")==tag or r.get("tagName")==tag), ""))' "$tag")"
          test -n "$url"
          curl --fail-with-body --retry 5 --retry-all-errors "$url/health"
      - name: Promote bootstrap candidate
        env:
          REVISION: ${{ steps.candidate.outputs.revision }}
        run: |
          set -euo pipefail
          revision="$REVISION"
          gcloud run services update-traffic "$SERVICE_NAME" --project="$PROJECT_ID" --region="$REGION" --to-revisions="$revision=100" --quiet
          url="$(gcloud run services describe "$SERVICE_NAME" --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)')"
          curl --fail-with-body --retry 5 --retry-all-errors "$url/health"

  rollback:
    name: Roll back failed bootstrap
    if: ${{ always() && needs.bootstrap.result == 'failure' && needs.bootstrap.outputs.previous_revision != '' }}
    needs: bootstrap
    runs-on: ubuntu-latest
    environment: platform-bootstrap
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
      - name: Restore previous revision
        run: gcloud run services update-traffic "$SERVICE_NAME" --project="$PROJECT_ID" --region="$REGION" --to-revisions="${{ needs.bootstrap.outputs.previous_revision }}=100" --quiet
