name: Reusable Cloud Run Promote

on:
  workflow_call:
    inputs:
      project-id:
        required: true
        type: string
      region:
        required: false
        type: string
        default: "us-central1"
      workload-identity-provider:
        required: true
        type: string
      deployer-service-account:
        required: true
        type: string
      api-service-name:
        required: true
        type: string
      api-target-revision:
        required: true
        type: string
      web-service-name:
        required: false
        type: string
        default: ""
      web-target-revision:
        required: false
        type: string
        default: ""
      promote-confirmation:
        required: true
        type: string
      version:
        required: false
        type: string
        default: ""
      platform-api-url:
        required: false
        type: string
        default: ""
      quality-gate-enabled:
        required: false
        type: boolean
        default: true
      quality-commit-sha:
        required: false
        type: string
        default: ""
      api-health-url:
        required: true
        type: string
      web-url:
        required: false
        type: string
        default: ""
      expected-openapi-paths:
        required: false
        type: string
        default: "1"
      promote-api:
        required: false
        type: boolean
        default: true
      promote-web:
        required: false
        type: boolean
        default: false
      runner_label:
        required: false
        type: string
        default: ""
    secrets:
      QUALITY_API_TOKEN:
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  promote:
    if: ${{ inputs.promote-confirmation == 'PROMOTE_PROD' }}
    runs-on: ${{ ((github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && inputs.runner_label == format('cgm-release-local-{0}', github.sha)) && inputs.runner_label || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Verify quality evidence for selected services
        env:
          QUALITY_GATE_ENABLED: ${{ inputs.quality-gate-enabled }}
          QUALITY_COMMIT_SHA: ${{ inputs.quality-commit-sha }}
          PLATFORM_API_URL: ${{ inputs.platform-api-url }}
          QUALITY_API_TOKEN: ${{ secrets.QUALITY_API_TOKEN }}
          API_SERVICE_NAME: ${{ inputs.api-service-name }}
          WEB_SERVICE_NAME: ${{ inputs.web-service-name }}
          PROMOTE_API: ${{ inputs.promote-api }}
          PROMOTE_WEB: ${{ inputs.promote-web }}
        run: |
          set -euo pipefail
          [ "$QUALITY_GATE_ENABLED" = "true" ] || (echo "Release quality is mandatory"; exit 1)
          test -n "$PLATFORM_API_URL" || (echo "platform-api-url is required when quality gate is enabled" && exit 1)
          test -n "$QUALITY_COMMIT_SHA" || (echo "quality-commit-sha is required for promotion" && exit 1)
          export VERIFIED_SHA="$QUALITY_COMMIT_SHA"
          verify_service() {
            local service="$1"
            curl --fail-with-body --retry 3 \
              -H "Authorization: Bearer $QUALITY_API_TOKEN" \
              "$PLATFORM_API_URL/api/quality/services/$service/commits/$QUALITY_COMMIT_SHA?for_release=true" \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); status=d.get("quality_gate_status"); print("{}: {}".format(d.get("service_name"), status)); sys.exit(0 if status=="PASSED" and d.get("policy_version")=="oss-v2" and d.get("commit_sha")==__import__("os").environ.get("VERIFIED_SHA") and d.get("repository")==__import__("os").environ.get("GITHUB_REPOSITORY") else 1)'
          }
          [ "$PROMOTE_API" != "true" ] || verify_service "$API_SERVICE_NAME"
          [ "$PROMOTE_WEB" != "true" ] || verify_service "$WEB_SERVICE_NAME"

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ inputs.workload-identity-provider }}
          service_account: ${{ inputs.deployer-service-account }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f

      - name: Snapshot current state
        run: |
          mkdir -p /tmp/promotion-snapshot
          gcloud run services describe "${{ inputs.api-service-name }}" \
            --project="${{ inputs.project-id }}" --region="${{ inputs.region }}" \
            --format="yaml(status.traffic,status.latestReadyRevisionName)" \
            | tee /tmp/promotion-snapshot/api-before.yaml
          if [ -n "${{ inputs.web-service-name }}" ]; then
            gcloud run services describe "${{ inputs.web-service-name }}" \
              --project="${{ inputs.project-id }}" --region="${{ inputs.region }}" \
              --format="yaml(status.traffic,status.latestReadyRevisionName)" \
              | tee /tmp/promotion-snapshot/web-before.yaml
          fi

      - name: Verify target revisions are Ready
        run: |
          set -euo pipefail
          revision_ready() {
            local revision="$1"
            local status
            status=$(gcloud run revisions describe "$revision" \
              --project="${{ inputs.project-id }}" \
              --region="${{ inputs.region }}" \
              --format='json(status.conditions)' | python3 -c 'import json,sys; d=json.load(sys.stdin); ready=any(c.get("type")=="Ready" and c.get("status")=="True" for c in d.get("status",{}).get("conditions",[])); sys.exit(0 if ready else 1)' && echo "ready" || echo "not-ready")
            test "$status" = "ready" || (echo "Revision $revision is not Ready" && exit 1)
          }

          if [ "${{ inputs.promote-api }}" = "true" ]; then
            revision_ready "${{ inputs.api-target-revision }}"
          fi

          if [ "${{ inputs.promote-web }}" = "true" ]; then
            revision_ready "${{ inputs.web-target-revision }}"
          fi

      - name: Promote API traffic
        if: ${{ inputs.promote-api }}
        run: |
          gcloud run services update-traffic "${{ inputs.api-service-name }}" \
            --project="${{ inputs.project-id }}" \
            --region="${{ inputs.region }}" \
            --to-revisions="${{ inputs.api-target-revision }}=100" \
            --quiet

      - name: Promote Web traffic
        if: ${{ inputs.promote-web }}
        run: |
          gcloud run services update-traffic "${{ inputs.web-service-name }}" \
            --project="${{ inputs.project-id }}" \
            --region="${{ inputs.region }}" \
            --to-revisions="${{ inputs.web-target-revision }}=100" \
            --quiet

      - name: Smoke post-promote
        env:
          API_HEALTH_URL: ${{ inputs.api-health-url }}
          WEB_URL: ${{ inputs.web-url }}
          EXPECTED_OPENAPI_PATHS: ${{ inputs.expected-openapi-paths }}
        run: |
          set -euo pipefail
          curl -fsS "$API_HEALTH_URL" || exit 1

          if [ "$EXPECTED_OPENAPI_PATHS" != "0" ]; then
            # shellcheck disable=SC2001
            API_BASE="$(echo "$API_HEALTH_URL" | sed 's|/health$||')"
            OPENAPI_COUNT=$(curl -s "${API_BASE}/openapi.json" | python3 -c "import json,sys; print(len(json.load(sys.stdin).get('paths',{})))")
            if [ "$OPENAPI_COUNT" -lt "$EXPECTED_OPENAPI_PATHS" ]; then
              echo "OpenAPI path count $OPENAPI_COUNT is below expected $EXPECTED_OPENAPI_PATHS"
              exit 1
            fi
          fi

          if [ -n "$WEB_URL" ]; then
            curl -fsS -I "$WEB_URL" || exit 1
          fi
          echo "Post-promotion smoke passed"

      - name: Promotion report
        run: |
          {
            echo "## Promotion Result"
            echo
            echo "- **API Revision:** ${{ inputs.api-target-revision }}"
            echo "- **Web Revision:** ${{ inputs.web-target-revision }}"
            echo
            echo "### Rollback Commands"
            echo '```bash'
            echo "gcloud run services update-traffic ${{ inputs.api-service-name }} --project=${{ inputs.project-id }} --region=${{ inputs.region }} --to-revisions=<PREVIOUS_API_REVISION>=100"
            if [ -n "${{ inputs.web-service-name }}" ]; then
              echo "gcloud run services update-traffic ${{ inputs.web-service-name }} --project=${{ inputs.project-id }} --region=${{ inputs.region }} --to-revisions=<PREVIOUS_WEB_REVISION>=100"
            fi
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Register promotion in Platform API
        if: ${{ inputs.platform-api-url != '' }}
        env:
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          API_REVISION: ${{ inputs.api-target-revision }}
          WEB_REVISION: ${{ inputs.web-target-revision }}
          PLATFORM_API_URL: ${{ inputs.platform-api-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          SERVICES=""
          if [ "${{ inputs.promote-api }}" = "true" ]; then
            SERVICES="{\"service_name\":\"${{ inputs.api-service-name }}\",\"revision\":\"$API_REVISION\",\"action\":\"promoted\"}"
          fi
          if [ "${{ inputs.promote-web }}" = "true" ]; then
            [ -z "$SERVICES" ] || SERVICES="$SERVICES,"
            SERVICES="$SERVICES{\"service_name\":\"${{ inputs.web-service-name }}\",\"revision\":\"$WEB_REVISION\",\"action\":\"promoted\"}"
          fi
          SERVICES_JSON="[$SERVICES]"
          curl -fsS -X POST "$PLATFORM_API_URL/api/releases/" \
            -H "Content-Type: application/json" \
            -d "{\"repository\":\"$REPOSITORY\",\"version\":\"$VERSION\",\"status\":\"promoted\",\"services\":$SERVICES_JSON,\"github_run_url\":\"$RUN_URL\"}"
