name: Service Onboarding Plan

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Source repository (owner/name)"
        required: true
        type: string
      service_name:
        description: "Cloud Run service name"
        required: true
        type: string
      service_type:
        description: "Service type"
        required: true
        type: choice
        options:
          - api
          - web
          - worker
          - integration
      runtime:
        description: "Runtime stack"
        required: true
        type: choice
        options:
          - python
          - node
          - static
      gcp_project:
        description: "GCP project ID"
        required: true
        type: string
        default: "cgm-assistant-prod"
      region:
        description: "GCP region"
        required: false
        type: string
        default: "us-central1"
      owner:
        description: "Owning team"
        required: true
        type: string
      cost_center:
        description: "Cost center code"
        required: true
        type: string
      environment:
        description: "Environment"
        required: false
        type: choice
        options:
          - prod
          - staging
          - dev
        default: "prod"
      health_path:
        description: "Health check path"
        required: false
        type: string
        default: "/health"
      openapi_path:
        description: "OpenAPI spec path"
        required: false
        type: string
        default: "/openapi.json"
      coverage_threshold:
        description: "Blocking coverage threshold"
        required: false
        type: number
        default: 70

permissions:
  contents: read

jobs:
  generate-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Generate onboarding artifacts
        env:
          REPOSITORY: ${{ inputs.repository }}
          SERVICE_NAME: ${{ inputs.service_name }}
          SERVICE_TYPE: ${{ inputs.service_type }}
          RUNTIME: ${{ inputs.runtime }}
          GCP_PROJECT: ${{ inputs.gcp_project }}
          REGION: ${{ inputs.region }}
          OWNER: ${{ inputs.owner }}
          COST_CENTER: ${{ inputs.cost_center }}
          ENV: ${{ inputs.environment }}
          HEALTH_PATH: ${{ inputs.health_path }}
          OPENAPI_PATH: ${{ inputs.openapi_path }}
          COVERAGE_THRESHOLD: ${{ inputs.coverage_threshold }}
        run: |
          set -euo pipefail

          mkdir -p /tmp/onboarding-artifacts

          # Generate release contract YAML
          cat > "/tmp/onboarding-artifacts/gcp-service-release.yaml" << 'YAMLEOF'
          # Service release contract — generated by Engineering Platform
          # https://github.com/diegomad14/gcp-engineering-platform

          service:
            name: ${SERVICE_NAME}
            repository: ${REPOSITORY}
            type: ${SERVICE_TYPE}

          release_target:
            platform: gcp-cloud-run
            service_name: ${SERVICE_NAME}
            project_id: ${GCP_PROJECT}
            region: ${REGION}
            url: https://${SERVICE_NAME}-XXXXX-uc.a.run.app
            health_path: ${HEALTH_PATH}
            openapi_path: ${OPENAPI_PATH}
            expected_openapi_paths: 1

          validation_targets:
            smoke_endpoints: []

          quality:
            quality_gate:
              enabled: true
              profile: ${RUNTIME}
              working_directory: .
              coverage_threshold: ${COVERAGE_THRESHOLD}
              blocking: true

          security:
            workload_identity_provider: \${{ vars.GCP_WIF_PROVIDER }}
            deployer_service_account: \${{ vars.GCP_WIF_SERVICE_ACCOUNT }}
            forbidden:
              - GCP_SA_KEY
              - service_account_json
              - .env

          finops:
            labels:
              service: ${SERVICE_NAME}
              env: ${ENV}
              owner: ${OWNER}
              cost_center: ${COST_CENTER}
          YAMLEOF

          # Generate labels manifest
          cat > /tmp/onboarding-artifacts/cloud-run-labels.yaml << 'LABELEOF'
          # Cloud Run Service Labels
          # Apply: gcloud run services update ${SERVICE_NAME} \
          #   --project=${GCP_PROJECT} --region=${REGION} \
          #   --update-labels=service=${SERVICE_NAME},env=${ENV},owner=${OWNER},cost_center=${COST_CENTER}

          labels:
            service: ${SERVICE_NAME}
            env: ${ENV}
            owner: ${OWNER}
            cost_center: ${COST_CENTER}
          LABELEOF

          # Generate onboarding checklist
          cat > /tmp/onboarding-artifacts/onboarding-checklist.md << 'CHECKEOF'
          # ${SERVICE_NAME} — Onboarding Checklist

          1. Create Cloud Run service: `${SERVICE_NAME}` in `${GCP_PROJECT}` (`${REGION}`)
          2. Apply labels from `cloud-run-labels.yaml`
          3. Create Artifact Registry repo (if not exists)
          4. Create runtime SA: `${SERVICE_NAME}-runtime@${GCP_PROJECT}.iam.gserviceaccount.com`
          5. Create deployer SA with WIF/OIDC binding
          6. Add `QUALITY_API_TOKEN` to GitHub secrets
          7. Add `ENG_PLATFORM_API_URL`, `GCP_WIF_PROVIDER`, `GCP_WIF_SERVICE_ACCOUNT`, `GCP_PROJECT_ID`, `GCP_REGION` to GitHub vars
          8. Copy caller workflows to `.github/workflows/` in the service repository
          9. Copy `gcp-service-release.yaml` to the service repository
          10. Open PR with generated artifacts
          11. Complete platform adoption readiness checklist
          12. Schedule platform review
          CHECKEOF

          # Generate quality gate configuration
          cat > /tmp/onboarding-artifacts/.quality-gate.yml << 'QUALITYEOF'
          service_name: ${SERVICE_NAME}
          profile: ${RUNTIME}
          working_directory: .
          coverage_threshold: ${COVERAGE_THRESHOLD}
          blocking:
            lint: true
            tests: true
            build: true
            sast_severities: [ERROR]
            dependency_severities: [HIGH, CRITICAL]
            secrets: true
          QUALITYEOF

          for file in /tmp/onboarding-artifacts/*; do
            sed -i \
              -e "s|\${REPOSITORY}|$REPOSITORY|g" \
              -e "s|\${SERVICE_NAME}|$SERVICE_NAME|g" \
              -e "s|\${SERVICE_TYPE}|$SERVICE_TYPE|g" \
              -e "s|\${GCP_PROJECT}|$GCP_PROJECT|g" \
              -e "s|\${REGION}|$REGION|g" \
              -e "s|\${OWNER}|$OWNER|g" \
              -e "s|\${COST_CENTER}|$COST_CENTER|g" \
              -e "s|\${ENV}|$ENV|g" \
              -e "s|\${HEALTH_PATH}|$HEALTH_PATH|g" \
              -e "s|\${OPENAPI_PATH}|$OPENAPI_PATH|g" \
              -e "s|\${RUNTIME}|$RUNTIME|g" \
              -e "s|\${COVERAGE_THRESHOLD}|$COVERAGE_THRESHOLD|g" \
              "$file"
          done

          echo "Generated artifacts:"
          ls -la /tmp/onboarding-artifacts/

      - name: Upload onboarding artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: onboarding-plan-${{ inputs.service_name }}
          path: /tmp/onboarding-artifacts/
          retention-days: 30

      - name: Summary
        run: |
          {
            echo "## Service Onboarding Plan — ${{ inputs.service_name }}"
            echo
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Repository | ${{ inputs.repository }} |"
            echo "| Service | ${{ inputs.service_name }} |"
            echo "| Type | ${{ inputs.service_type }} |"
            echo "| Runtime | ${{ inputs.runtime }} |"
            echo "| GCP Project | ${{ inputs.gcp_project }} |"
            echo "| Region | ${{ inputs.region }} |"
            echo "| Owner | ${{ inputs.owner }} |"
            echo "| Cost Center | ${{ inputs.cost_center }} |"
            echo "| Environment | ${{ inputs.environment }} |"
            echo
            echo "### Next Steps"
            echo "1. Download the onboarding artifacts from this run"
            echo "2. Review and customize generated files"
            echo "3. Open a PR in the service repository with the artifacts"
            echo "4. Schedule platform adoption review"
            echo
            echo "**No GCP resources were created. No IAM was modified.**"
          } | tee -a "$GITHUB_STEP_SUMMARY"
