name: Reusable Cloud Run Rollback

on:
  workflow_call:
    inputs:
      project-id:
        required: true
        type: string
      region:
        required: false
        type: string
        default: "us-central1"
      workload-identity-provider:
        required: true
        type: string
      deployer-service-account:
        required: true
        type: string
      api-service-name:
        required: true
        type: string
      api-rollback-revision:
        required: true
        type: string
      web-service-name:
        required: false
        type: string
        default: ""
      web-rollback-revision:
        required: false
        type: string
        default: ""
      rollback-confirmation:
        required: true
        type: string
      platform-api-url:
        required: false
        type: string
        default: ""
      quality-gate-enabled:
        required: false
        type: boolean
        default: false
      quality-commit-sha:
        required: false
        type: string
        default: ""
      api-health-url:
        required: true
        type: string
      web-url:
        required: false
        type: string
        default: ""
      expected-openapi-paths:
        required: false
        type: string
        default: "1"
      rollback-api:
        required: false
        type: boolean
        default: true
      rollback-web:
        required: false
        type: boolean
        default: false
      runner_label:
        required: false
        type: string
        default: ""
    secrets:
      QUALITY_API_TOKEN:
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  rollback:
    if: ${{ inputs.rollback-confirmation == 'ROLLBACK_PROD' }}
    runs-on: ${{ ((github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && inputs.runner_label == format('cgm-release-local-{0}', github.sha)) && inputs.runner_label || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ inputs.workload-identity-provider }}
          service_account: ${{ inputs.deployer-service-account }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f

      - name: Verify recorded api rollback provenance
        if: ${{ inputs.rollback-api }}
        uses: diegomad14/gcp-engineering-platform-api/.github/actions/verify-rollback@fix/oss-release-quality
        with:
          platform-api-url: ${{ inputs.platform-api-url }}
          service-name: ${{ inputs.api-service-name }}
          revision: ${{ inputs.api-rollback-revision }}
      - name: Verify recorded web rollback provenance
        if: ${{ inputs.rollback-web }}
        uses: diegomad14/gcp-engineering-platform-api/.github/actions/verify-rollback@fix/oss-release-quality
        with:
          platform-api-url: ${{ inputs.platform-api-url }}
          service-name: ${{ inputs.web-service-name }}
          revision: ${{ inputs.web-rollback-revision }}

      - name: Snapshot current state
        env:
          RUN_INPUTS_API_SERVICE_NAME: ${{ inputs.api-service-name }}
          RUN_INPUTS_PROJECT_ID: ${{ inputs.project-id }}
          RUN_INPUTS_REGION: ${{ inputs.region }}
          RUN_INPUTS_WEB_SERVICE_NAME: ${{ inputs.web-service-name }}
        run: |
          mkdir -p /tmp/rollback-snapshot
          gcloud run services describe "${RUN_INPUTS_API_SERVICE_NAME}" \
            --project="${RUN_INPUTS_PROJECT_ID}" --region="${RUN_INPUTS_REGION}" \
            --format="yaml(status.traffic,status.latestReadyRevisionName)" \
            | tee /tmp/rollback-snapshot/api-before.yaml
          if [ -n "${RUN_INPUTS_WEB_SERVICE_NAME}" ]; then
            gcloud run services describe "${RUN_INPUTS_WEB_SERVICE_NAME}" \
              --project="${RUN_INPUTS_PROJECT_ID}" --region="${RUN_INPUTS_REGION}" \
              --format="yaml(status.traffic,status.latestReadyRevisionName)" \
              | tee /tmp/rollback-snapshot/web-before.yaml
          fi

      - name: Verify rollback revisions are Ready
        env:
          RUN_INPUTS_PROJECT_ID: ${{ inputs.project-id }}
          RUN_INPUTS_REGION: ${{ inputs.region }}
          RUN_INPUTS_ROLLBACK_API: ${{ inputs.rollback-api }}
          RUN_INPUTS_API_ROLLBACK_REVISION: ${{ inputs.api-rollback-revision }}
          RUN_INPUTS_ROLLBACK_WEB: ${{ inputs.rollback-web }}
          RUN_INPUTS_WEB_ROLLBACK_REVISION: ${{ inputs.web-rollback-revision }}
        run: |
          set -euo pipefail
          revision_ready() {
            local revision="$1"
            local status
            status=$(gcloud run revisions describe "$revision" \
              --project="${RUN_INPUTS_PROJECT_ID}" \
              --region="${RUN_INPUTS_REGION}" \
              --format='json(status.conditions)' | python3 -c 'import json,sys; d=json.load(sys.stdin); ready=any(c.get("type")=="Ready" and c.get("status")=="True" for c in d.get("status",{}).get("conditions",[])); sys.exit(0 if ready else 1)' && echo "ready" || echo "not-ready")
            test "$status" = "ready" || (echo "Rollback revision $revision is not Ready" && exit 1)
          }
          if [ "${RUN_INPUTS_ROLLBACK_API}" = "true" ]; then
            revision_ready "${RUN_INPUTS_API_ROLLBACK_REVISION}"
          fi
          if [ "${RUN_INPUTS_ROLLBACK_WEB}" = "true" ]; then
            revision_ready "${RUN_INPUTS_WEB_ROLLBACK_REVISION}"
          fi

      - name: Rollback API traffic
        if: ${{ inputs.rollback-api }}
        env:
          RUN_INPUTS_API_SERVICE_NAME: ${{ inputs.api-service-name }}
          RUN_INPUTS_PROJECT_ID: ${{ inputs.project-id }}
          RUN_INPUTS_REGION: ${{ inputs.region }}
          RUN_INPUTS_API_ROLLBACK_REVISION: ${{ inputs.api-rollback-revision }}
        run: |
          gcloud run services update-traffic "${RUN_INPUTS_API_SERVICE_NAME}" \
            --project="${RUN_INPUTS_PROJECT_ID}" \
            --region="${RUN_INPUTS_REGION}" \
            --to-revisions="${RUN_INPUTS_API_ROLLBACK_REVISION}=100" \
            --quiet

      - name: Rollback Web traffic
        if: ${{ inputs.rollback-web }}
        env:
          RUN_INPUTS_WEB_SERVICE_NAME: ${{ inputs.web-service-name }}
          RUN_INPUTS_PROJECT_ID: ${{ inputs.project-id }}
          RUN_INPUTS_REGION: ${{ inputs.region }}
          RUN_INPUTS_WEB_ROLLBACK_REVISION: ${{ inputs.web-rollback-revision }}
        run: |
          gcloud run services update-traffic "${RUN_INPUTS_WEB_SERVICE_NAME}" \
            --project="${RUN_INPUTS_PROJECT_ID}" \
            --region="${RUN_INPUTS_REGION}" \
            --to-revisions="${RUN_INPUTS_WEB_ROLLBACK_REVISION}=100" \
            --quiet

      - name: Smoke post-rollback
        env:
          API_HEALTH_URL: ${{ inputs.api-health-url }}
          WEB_URL: ${{ inputs.web-url }}
          EXPECTED_OPENAPI_PATHS: ${{ inputs.expected-openapi-paths }}
        run: |
          set -euo pipefail
          curl -fsS "$API_HEALTH_URL" || exit 1

          if [ "$EXPECTED_OPENAPI_PATHS" != "0" ]; then
            # shellcheck disable=SC2001
            API_BASE="$(echo "$API_HEALTH_URL" | sed 's|/health$||')"
            OPENAPI_RESPONSE="$(mktemp)"
            curl --fail --silent --show-error "${API_BASE}/openapi.json" -o "$OPENAPI_RESPONSE"
            OPENAPI_COUNT=$(python3 -c "import json,sys; print(len(json.load(sys.stdin).get('paths',{})))" < "$OPENAPI_RESPONSE")
            if [ "$OPENAPI_COUNT" -lt "$EXPECTED_OPENAPI_PATHS" ]; then
              echo "OpenAPI path count $OPENAPI_COUNT is below expected $EXPECTED_OPENAPI_PATHS"
              exit 1
            fi
          fi

          if [ -n "$WEB_URL" ]; then
            curl -fsS -I "$WEB_URL" || exit 1
          fi
          echo "Post-rollback smoke passed"

      - name: Rollback report
        env:
          RUN_INPUTS_API_ROLLBACK_REVISION: ${{ inputs.api-rollback-revision }}
          RUN_INPUTS_WEB_ROLLBACK_REVISION: ${{ inputs.web-rollback-revision }}
        run: |
          {
            echo "## Rollback Result"
            echo
            echo "- **API Rollback Revision:** ${RUN_INPUTS_API_ROLLBACK_REVISION}"
            echo "- **Web Rollback Revision:** ${RUN_INPUTS_WEB_ROLLBACK_REVISION}"
            echo "- **No deploy executed. Only Cloud Run traffic was moved.**"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Register rollback in Platform API
        if: ${{ inputs.platform-api-url != '' }}
        env:
          RUN_INPUTS_ROLLBACK_API: ${{ inputs.rollback-api }}
          RUN_INPUTS_API_SERVICE_NAME: ${{ inputs.api-service-name }}
          RUN_INPUTS_ROLLBACK_WEB: ${{ inputs.rollback-web }}
          RUN_INPUTS_WEB_SERVICE_NAME: ${{ inputs.web-service-name }}
          REPOSITORY: ${{ github.repository }}
          API_REVISION: ${{ inputs.api-rollback-revision }}
          WEB_REVISION: ${{ inputs.web-rollback-revision }}
          PLATFORM_API_URL: ${{ inputs.platform-api-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          SERVICES=""
          if [ "${RUN_INPUTS_ROLLBACK_API}" = "true" ]; then
            SERVICES="{\"service_name\":\"${RUN_INPUTS_API_SERVICE_NAME}\",\"revision\":\"$API_REVISION\",\"action\":\"rolled_back\"}"
          fi
          if [ "${RUN_INPUTS_ROLLBACK_WEB}" = "true" ]; then
            [ -z "$SERVICES" ] || SERVICES="$SERVICES,"
            SERVICES="$SERVICES{\"service_name\":\"${RUN_INPUTS_WEB_SERVICE_NAME}\",\"revision\":\"$WEB_REVISION\",\"action\":\"rolled_back\"}"
          fi
          SERVICES_JSON="[$SERVICES]"
          VERSION="rollback-$(date +%Y%m%d-%H%M%S)"
          curl -fsS -X POST "$PLATFORM_API_URL/api/releases/" \
            -H "Content-Type: application/json" \
            -d "{\"repository\":\"$REPOSITORY\",\"version\":\"$VERSION\",\"status\":\"rolled_back\",\"services\":$SERVICES_JSON,\"github_run_url\":\"$RUN_URL\"}"
