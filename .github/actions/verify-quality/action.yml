name: Verify release quality
description: Require exact repository and commit evidence from the service or its explicitly authorized owner.
inputs:
  platform-api-url:
    required: true
    description: Engineering Platform API URL
  service-name:
    required: true
    description: Catalog service name
  commit-sha:
    required: true
    description: Full commit SHA of the artifact
  wait-seconds:
    default: '0'
    description: Maximum wait for main CI to publish evidence
  release-tag:
    default: ''
    description: Optional release tag to bind to the exact evidence SHA (empty for pre-tag CI)
runs:
  using: composite
  steps:
    - shell: bash
      env:
        QUALITY_URL: ${{ inputs.platform-api-url }}
        QUALITY_SERVICE: ${{ inputs.service-name }}
        QUALITY_SHA: ${{ inputs.commit-sha }}
        QUALITY_WAIT: ${{ inputs.wait-seconds }}
        QUALITY_TAG: ${{ inputs.release-tag }}
      run: python3 "${{ github.action_path }}/verify.py"
