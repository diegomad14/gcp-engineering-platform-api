name: Promote to PROD

on:
  workflow_dispatch:
    inputs:
      project_id:
        required: true
        type: string
      region:
        required: true
        type: string
      api_service:
        required: true
        type: string
      web_service:
        required: false
        type: string
      release_tag:
        required: true
        type: string
      api_revision:
        required: false
        type: string
      web_revision:
        required: false
        type: string
      expected_current_api_revision:
        required: false
        type: string
      expected_current_web_revision:
        required: false
        type: string
      api_rollback_revision:
        required: false
        type: string
      web_rollback_revision:
        required: false
        type: string
      api_health_url:
        required: true
        type: string
      web_url:
        required: false
        type: string
      expected_openapi_paths:
        required: false
        default: "0"
        type: string
      promote_api:
        required: true
        default: false
        type: boolean
      promote_web:
        required: true
        default: false
        type: boolean
      confirm:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency: production-promotion

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f

      - name: Validate promotion inputs
        env:
          PROMOTE_API: ${{ inputs.promote_api }}
          PROMOTE_WEB: ${{ inputs.promote_web }}
        run: |
          set -euo pipefail
          test "${{ inputs.confirm }}" = "PROMOTE_PROD"
          [[ "${{ inputs.release_tag }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

          if [[ "$PROMOTE_API" != "true" && "$PROMOTE_WEB" != "true" ]]; then
            echo "At least one of promote_api or promote_web must be true"
            exit 1
          fi

          if [[ "$PROMOTE_API" == "true" ]]; then
            test -n "${{ inputs.api_revision }}"
            test -n "${{ inputs.expected_current_api_revision }}"
            test -n "${{ inputs.api_rollback_revision }}"
          fi

          if [[ "$PROMOTE_WEB" == "true" ]]; then
            test -n "${{ inputs.web_service }}"
            test -n "${{ inputs.web_revision }}"
            test -n "${{ inputs.expected_current_web_revision }}"
            test -n "${{ inputs.web_rollback_revision }}"
            test -n "${{ inputs.web_url }}"
          fi

      - name: Snapshot current API and Web routing
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/promotion-snapshot"

          gcloud run services describe "${{ inputs.api_service }}" \
            --project="${{ inputs.project_id }}" \
            --region="${{ inputs.region }}" \
            --format=yaml \
            | tee "$RUNNER_TEMP/promotion-snapshot/api-before.yaml"

          if [[ -n "${{ inputs.web_service }}" ]]; then
            gcloud run services describe "${{ inputs.web_service }}" \
              --project="${{ inputs.project_id }}" \
              --region="${{ inputs.region }}" \
              --format=yaml \
              | tee "$RUNNER_TEMP/promotion-snapshot/web-before.yaml"
          fi

      - name: Verify current revisions and target readiness
        env:
          PROMOTE_API: ${{ inputs.promote_api }}
          PROMOTE_WEB: ${{ inputs.promote_web }}
        run: |
          set -euo pipefail

          active_revision() {
            local service="$1"
            gcloud run services describe "$service" \
              --project="${{ inputs.project_id }}" \
              --region="${{ inputs.region }}" \
              --format=json \
              | python3 -c 'import json,sys
          data=json.load(sys.stdin)
          active=[i.get("revisionName") for i in data.get("status", {}).get("traffic", []) if i.get("percent") == 100]
          if len(active) != 1:
              raise SystemExit(f"expected exactly one active 100% revision, got {active}")
          print(active[0])'
          }

          revision_ready() {
            local revision="$1"
            gcloud run revisions describe "$revision" \
              --project="${{ inputs.project_id }}" \
              --region="${{ inputs.region }}" \
              --format=json \
              | python3 -c 'import json,sys
          data=json.load(sys.stdin)
          ready=any(c.get("type") == "Ready" and c.get("status") == "True" for c in data.get("status", {}).get("conditions", []))
          if not ready:
              raise SystemExit("revision is not Ready")
          print(data.get("metadata", {}).get("name", ""))'
          }

          if [[ "$PROMOTE_API" == "true" ]]; then
            CURRENT_API="$(active_revision "${{ inputs.api_service }}")"
            test "$CURRENT_API" = "${{ inputs.expected_current_api_revision }}"
            revision_ready "${{ inputs.api_revision }}" >/dev/null
          fi

          if [[ "$PROMOTE_WEB" == "true" ]]; then
            CURRENT_WEB="$(active_revision "${{ inputs.web_service }}")"
            test "$CURRENT_WEB" = "${{ inputs.expected_current_web_revision }}"
            revision_ready "${{ inputs.web_revision }}" >/dev/null
          fi

      - name: Promote API traffic
        if: ${{ inputs.promote_api }}
        run: |
          set -euo pipefail
          gcloud run services update-traffic "${{ inputs.api_service }}" \
            --project="${{ inputs.project_id }}" \
            --region="${{ inputs.region }}" \
            --to-revisions="${{ inputs.api_revision }}=100" \
            --quiet

      - name: Promote Web traffic
        if: ${{ inputs.promote_web }}
        run: |
          set -euo pipefail
          gcloud run services update-traffic "${{ inputs.web_service }}" \
            --project="${{ inputs.project_id }}" \
            --region="${{ inputs.region }}" \
            --to-revisions="${{ inputs.web_revision }}=100" \
            --quiet

      - name: Verify promoted traffic
        env:
          PROMOTE_API: ${{ inputs.promote_api }}
          PROMOTE_WEB: ${{ inputs.promote_web }}
        run: |
          set -euo pipefail

          verify_active() {
            local service="$1"
            local expected="$2"
            gcloud run services describe "$service" \
              --project="${{ inputs.project_id }}" \
              --region="${{ inputs.region }}" \
              --format=json \
              | python3 -c 'import json,sys
          expected=sys.argv[1]
          data=json.load(sys.stdin)
          active=[i for i in data.get("status", {}).get("traffic", []) if i.get("percent") == 100]
          if len(active) != 1 or active[0].get("revisionName") != expected:
              raise SystemExit(f"active traffic does not match {expected}: {active}")
          print(f"{expected}=100")' "$expected"
          }

          if [[ "$PROMOTE_API" == "true" ]]; then
            verify_active "${{ inputs.api_service }}" "${{ inputs.api_revision }}"
          fi

          if [[ "$PROMOTE_WEB" == "true" ]]; then
            verify_active "${{ inputs.web_service }}" "${{ inputs.web_revision }}"
          fi

      - name: Post-promotion diagnostics
        env:
          API_HEALTH_URL: ${{ inputs.api_health_url }}
          WEB_URL: ${{ inputs.web_url }}
          EXPECTED_OPENAPI_PATHS: ${{ inputs.expected_openapi_paths }}
        run: |
          set +e
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          api_health_url = os.environ["API_HEALTH_URL"]
          web_url = os.environ.get("WEB_URL", "").rstrip("/")
          expected_openapi_paths = int(os.environ.get("EXPECTED_OPENAPI_PATHS") or "0")

          def request(url, method="GET", headers=None):
              req = urllib.request.Request(url, method=method, headers=headers or {})
              try:
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      return resp.status, resp.read(), resp.headers
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.read(), exc.headers

          status, _, _ = request(api_health_url)
          if status != 200:
              print(f"::warning::API health failed after promotion: HTTP {status}")
          else:
              print("API health passed after promotion")

          if expected_openapi_paths:
              api_base = api_health_url.rsplit("/health", 1)[0]
              status, body, _ = request(api_base + "/openapi.json")
              if status != 200:
                  print(f"::warning::OpenAPI failed after promotion: HTTP {status}")
              else:
                  count = len(json.loads(body).get("paths", {}))
                  if count < expected_openapi_paths:
                      print(f"::warning::OpenAPI path count {count} is below {expected_openapi_paths}")
                  else:
                      print(f"OpenAPI path count passed: {count}")

          if web_url:
              status, _, _ = request(web_url + "/", method="HEAD")
              if status != 200:
                  print(f"::warning::Web HEAD failed after promotion: HTTP {status}")
              else:
                  print("Web HEAD passed after promotion")

              status, _, headers = request(
                  api_health_url,
                  method="OPTIONS",
                  headers={
                      "Origin": web_url,
                      "Access-Control-Request-Method": "GET",
                  },
              )
              if status < 200 or status >= 300:
                  print(f"::warning::CORS preflight failed after promotion: HTTP {status}")
              else:
                  allow_origin = headers.get("Access-Control-Allow-Origin", "")
                  if allow_origin not in {web_url, "*"}:
                      print(f"::warning::CORS preflight returned unexpected allow-origin: {allow_origin!r}")
                  else:
                      print("CORS preflight passed after promotion")

          print("Post-promotion diagnostics completed")
          PY
          exit 0

      - name: Register promotion
        env:
          PLATFORM_API_URL: ${{ vars.PLATFORM_API_URL }}
          PROMOTE_API: ${{ inputs.promote_api }}
          PROMOTE_WEB: ${{ inputs.promote_web }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ -z "${PLATFORM_API_URL:-}" ]]; then
            echo "::warning::PLATFORM_API_URL is not configured; release registration skipped"
            exit 0
          fi

          python3 - <<'PY'
          import json
          import os
          import urllib.request

          services = []
          if os.environ["PROMOTE_API"] == "true":
              services.append({
                  "service_name": "${{ inputs.api_service }}",
                  "revision": "${{ inputs.api_revision }}",
                  "action": "promoted",
              })
          if os.environ["PROMOTE_WEB"] == "true":
              services.append({
                  "service_name": "${{ inputs.web_service }}",
                  "revision": "${{ inputs.web_revision }}",
                  "action": "promoted",
              })

          payload = {
              "repository": "${{ github.repository }}",
              "version": "${{ inputs.release_tag }}",
              "status": "promoted",
              "services": services,
              "github_run_url": os.environ["GITHUB_RUN_URL"],
              "triggered_by": "github-actions",
              "notes": "Normal production promotion",
          }
          req = urllib.request.Request(
              os.environ["PLATFORM_API_URL"].rstrip("/") + "/api/releases/",
              data=json.dumps(payload).encode(),
              method="POST",
              headers={"Content-Type": "application/json"},
          )
          try:
              with urllib.request.urlopen(req, timeout=20) as resp:
                  print(f"Registered promotion: HTTP {resp.status}")
          except Exception as exc:
              print(f"::warning::Release registration failed: {exc}")
          PY

      - name: Print rollback commands
        run: |
          {
            echo "## Promotion Result"
            echo
            echo "- release_tag: ${{ inputs.release_tag }}"
            echo "- api_revision: ${{ inputs.api_revision }}"
            echo "- web_revision: ${{ inputs.web_revision }}"
            echo
            echo "Rollback API:"
            echo '```bash'
            echo "gcloud run services update-traffic ${{ inputs.api_service }} --project=${{ inputs.project_id }} --region=${{ inputs.region }} --to-revisions=${{ inputs.api_rollback_revision }}=100"
            echo '```'
            echo
            if [[ -n "${{ inputs.web_service }}" ]]; then
              echo "Rollback Web:"
              echo '```bash'
              echo "gcloud run services update-traffic ${{ inputs.web_service }} --project=${{ inputs.project_id }} --region=${{ inputs.region }} --to-revisions=${{ inputs.web_rollback_revision }}=100"
              echo '```'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
