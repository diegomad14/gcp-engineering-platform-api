name: Rollback PROD

on:
  workflow_dispatch:
    inputs:
      project_id:
        required: true
        type: string
      region:
        required: true
        type: string
      release_tag:
        required: false
        type: string
      api_service:
        required: true
        type: string
      web_service:
        required: false
        type: string
      api_rollback_revision:
        required: false
        type: string
      web_rollback_revision:
        required: false
        type: string
      api_health_url:
        required: true
        type: string
      web_url:
        required: false
        type: string
      expected_openapi_paths:
        required: false
        default: "0"
        type: string
      rollback_api:
        required: true
        default: false
        type: boolean
      rollback_web:
        required: true
        default: false
        type: boolean
      confirm:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency: production-rollback

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f

      - name: Validate rollback inputs
        env:
          ROLLBACK_API: ${{ inputs.rollback_api }}
          ROLLBACK_WEB: ${{ inputs.rollback_web }}
        run: |
          set -euo pipefail
          test "${{ inputs.confirm }}" = "ROLLBACK_PROD"

          if [[ "$ROLLBACK_API" != "true" && "$ROLLBACK_WEB" != "true" ]]; then
            echo "At least one of rollback_api or rollback_web must be true"
            exit 1
          fi

          if [[ "$ROLLBACK_API" == "true" ]]; then
            test -n "${{ inputs.api_rollback_revision }}"
          fi

          if [[ "$ROLLBACK_WEB" == "true" ]]; then
            test -n "${{ inputs.web_service }}"
            test -n "${{ inputs.web_rollback_revision }}"
            test -n "${{ inputs.web_url }}"
          fi

      - name: Snapshot current API and Web routing
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rollback-snapshot"

          gcloud run services describe "${{ inputs.api_service }}" \
            --project="${{ inputs.project_id }}" \
            --region="${{ inputs.region }}" \
            --format=yaml \
            | tee "$RUNNER_TEMP/rollback-snapshot/api-before.yaml"

          if [[ -n "${{ inputs.web_service }}" ]]; then
            gcloud run services describe "${{ inputs.web_service }}" \
              --project="${{ inputs.project_id }}" \
              --region="${{ inputs.region }}" \
              --format=yaml \
              | tee "$RUNNER_TEMP/rollback-snapshot/web-before.yaml"
          fi

      - name: Verify rollback revisions are Ready
        env:
          ROLLBACK_API: ${{ inputs.rollback_api }}
          ROLLBACK_WEB: ${{ inputs.rollback_web }}
        run: |
          set -euo pipefail

          revision_ready() {
            local revision="$1"
            gcloud run revisions describe "$revision" \
              --project="${{ inputs.project_id }}" \
              --region="${{ inputs.region }}" \
              --format=json \
              | python3 -c 'import json,sys
          data=json.load(sys.stdin)
          ready=any(c.get("type") == "Ready" and c.get("status") == "True" for c in data.get("status", {}).get("conditions", []))
          if not ready:
              raise SystemExit("revision is not Ready")
          print(data.get("metadata", {}).get("name", ""))'
          }

          if [[ "$ROLLBACK_API" == "true" ]]; then
            revision_ready "${{ inputs.api_rollback_revision }}" >/dev/null
          fi

          if [[ "$ROLLBACK_WEB" == "true" ]]; then
            revision_ready "${{ inputs.web_rollback_revision }}" >/dev/null
          fi

      - name: Move API traffic to rollback revision
        if: ${{ inputs.rollback_api }}
        run: |
          set -euo pipefail
          gcloud run services update-traffic "${{ inputs.api_service }}" \
            --project="${{ inputs.project_id }}" \
            --region="${{ inputs.region }}" \
            --to-revisions="${{ inputs.api_rollback_revision }}=100" \
            --quiet

      - name: Move Web traffic to rollback revision
        if: ${{ inputs.rollback_web }}
        run: |
          set -euo pipefail
          gcloud run services update-traffic "${{ inputs.web_service }}" \
            --project="${{ inputs.project_id }}" \
            --region="${{ inputs.region }}" \
            --to-revisions="${{ inputs.web_rollback_revision }}=100" \
            --quiet

      - name: Smoke after rollback
        env:
          API_HEALTH_URL: ${{ inputs.api_health_url }}
          WEB_URL: ${{ inputs.web_url }}
          EXPECTED_OPENAPI_PATHS: ${{ inputs.expected_openapi_paths }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          api_health_url = os.environ["API_HEALTH_URL"]
          web_url = os.environ.get("WEB_URL", "").rstrip("/")
          expected_openapi_paths = int(os.environ.get("EXPECTED_OPENAPI_PATHS") or "0")

          def request(url, method="GET", headers=None):
              req = urllib.request.Request(url, method=method, headers=headers or {})
              try:
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      return resp.status, resp.read(), resp.headers
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.read(), exc.headers

          status, _, _ = request(api_health_url)
          if status != 200:
              raise SystemExit(f"API health failed after rollback: HTTP {status}")

          if expected_openapi_paths:
              api_base = api_health_url.rsplit("/health", 1)[0]
              status, body, _ = request(api_base + "/openapi.json")
              if status != 200:
                  raise SystemExit(f"OpenAPI failed after rollback: HTTP {status}")
              count = len(json.loads(body).get("paths", {}))
              if count < expected_openapi_paths:
                  raise SystemExit(f"OpenAPI path count {count} is below {expected_openapi_paths}")

          if web_url:
              status, _, _ = request(web_url + "/", method="HEAD")
              if status != 200:
                  raise SystemExit(f"Web HEAD failed after rollback: HTTP {status}")

              status, _, _ = request(
                  api_health_url,
                  method="OPTIONS",
                  headers={
                      "Origin": web_url,
                      "Access-Control-Request-Method": "GET",
                  },
              )
              if status < 200 or status >= 300:
                  raise SystemExit(f"CORS preflight failed after rollback: HTTP {status}")

          print("Post-rollback smoke passed")
          PY

      - name: Rollback report
        run: |
          {
            echo "## Rollback Result"
            echo
            echo "- api_rollback_revision: ${{ inputs.api_rollback_revision }}"
            echo "- web_rollback_revision: ${{ inputs.web_rollback_revision }}"
            echo "- rollback_api: ${{ inputs.rollback_api }}"
            echo "- rollback_web: ${{ inputs.rollback_web }}"
            echo
            echo "No deploy was executed. Only Cloud Run traffic was moved."
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Register rollback
        env:
          PLATFORM_API_URL: ${{ vars.PLATFORM_API_URL }}
          ROLLBACK_API: ${{ inputs.rollback_api }}
          ROLLBACK_WEB: ${{ inputs.rollback_web }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ -z "${PLATFORM_API_URL:-}" ]]; then
            echo "::warning::PLATFORM_API_URL is not configured; release registration skipped"
            exit 0
          fi

          python3 - <<'PY'
          import json
          import os
          import urllib.request

          services = []
          if os.environ["ROLLBACK_API"] == "true":
              services.append({
                  "service_name": "${{ inputs.api_service }}",
                  "revision": "${{ inputs.api_rollback_revision }}",
                  "action": "rolled_back",
              })
          if os.environ["ROLLBACK_WEB"] == "true":
              services.append({
                  "service_name": "${{ inputs.web_service }}",
                  "revision": "${{ inputs.web_rollback_revision }}",
                  "action": "rolled_back",
              })

          payload = {
              "repository": "${{ github.repository }}",
              "version": "${{ inputs.release_tag || 'rollback' }}",
              "status": "rolled_back",
              "services": services,
              "github_run_url": os.environ["GITHUB_RUN_URL"],
              "triggered_by": "github-actions",
              "notes": "Production rollback",
          }
          req = urllib.request.Request(
              os.environ["PLATFORM_API_URL"].rstrip("/") + "/api/releases/",
              data=json.dumps(payload).encode(),
              method="POST",
              headers={"Content-Type": "application/json"},
          )
          try:
              with urllib.request.urlopen(req, timeout=20) as resp:
                  print(f"Registered rollback: HTTP {resp.status}")
          except Exception as exc:
              print(f"::warning::Release registration failed: {exc}")
          PY
