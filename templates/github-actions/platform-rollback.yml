name: Platform Rollback

on:
  workflow_dispatch:
    inputs:
      service_name:
        description: Cloud Run service selected in Engineering Platform
        required: true
        type: string
      target_tag:
        description: Immutable semantic release tag being restored
        required: true
        type: string
      target_revision:
        description: Cloud Run revision to restore to 100 percent traffic
        required: true
        type: string
      github_deployment_id:
        description: GitHub Deployment created by Engineering Platform
        required: true
        type: string
      project_id:
        description: GCP project from the platform service catalog
        required: true
        type: string
      region:
        description: Cloud Run region from the platform service catalog
        required: true
        type: string
      health_path:
        description: Post-rollback smoke path
        required: true
        type: string
      runner_label:
        description: Emergency runner label; leave empty for hosted runner
        required: false
        default: ""
        type: string
      target_sha:
        description: Immutable commit SHA associated with the rollback tag
        required: true
        type: string
      platform_authorization:
        description: Signed authorization issued by Engineering Platform
        required: true
        type: string

permissions:
  contents: read
  deployments: write
  id-token: write

concurrency:
  group: deploy-${{ inputs.service_name }}
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ inputs.project_id }}
  REGION: ${{ inputs.region }}
  SERVICE_NAME: ${{ inputs.service_name }}
  TARGET_REVISION: ${{ inputs.target_revision }}
  HEALTH_PATH: ${{ inputs.health_path }}
  GITHUB_DEPLOYMENT_ID: ${{ inputs.github_deployment_id }}

jobs:
  rollback:
    name: Rollback production
    runs-on: ${{ ((github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && (inputs.runner_label == 'cgm-release-local' || (inputs.runner_label == '' && vars.CGM_ACTIONS_RUNNER == 'cgm-release-local'))) && inputs.runner_label || 'ubuntu-latest' }}
    environment: production
    steps:
      - name: Verify Engineering Platform authorization
        uses: diegomad14/gcp-engineering-platform-api/.github/actions/verify-release-authorization@2a18490
        with:
          token: ${{ inputs.platform_authorization }}
          repository: ${{ github.repository }}
          service_name: ${{ inputs.service_name }}
          tag: ${{ inputs.target_tag }}
          sha: ${{ inputs.target_sha }}
          github_deployment_id: ${{ inputs.github_deployment_id }}
          kind: rollback
          target_revision: ${{ inputs.target_revision }}
          platform_api_url: ${{ vars.ENG_PLATFORM_API_URL }}
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_RELEASE_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
      - name: Mark GitHub deployment in progress
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST \
            "repos/${{ github.repository }}/deployments/$GITHUB_DEPLOYMENT_ID/statuses" \
            -f state=in_progress \
            -f log_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -f description='Rollback started' >/dev/null
      - name: Verify target revision is Ready
        run: |
          set -euo pipefail
          READY=$(gcloud run revisions describe "$TARGET_REVISION" \
            --project="$PROJECT_ID" --region="$REGION" \
            --format='json(status.conditions)' \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); ready=any(c.get("type")=="Ready" and c.get("status")=="True" for c in d.get("status",{}).get("conditions",[])); print("ready" if ready else "not-ready")')
          test "$READY" = "ready"
      - name: Verify recorded rollback provenance
        uses: diegomad14/gcp-engineering-platform-api/.github/actions/verify-rollback@ac9d68554c8b6332013785a5bcf451eabfee93ec
        with:
          platform-api-url: ${{ vars.ENG_PLATFORM_API_URL }}
          service-name: ${{ inputs.service_name }}
          revision: ${{ inputs.target_revision }}
      - name: Restore target revision to 100 percent traffic
        run: gcloud run services update-traffic "$SERVICE_NAME" --project="$PROJECT_ID" --region="$REGION" --to-revisions="$TARGET_REVISION=100" --quiet
      - name: Smoke production
        run: |
          URL=$(gcloud run services describe "$SERVICE_NAME" --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)')
          curl --fail-with-body --retry 5 --retry-all-errors "$URL$HEALTH_PATH"
      - name: Mark GitHub deployment result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STATE=$([ "${{ job.status }}" = success ] && echo success || echo failure)
          gh api --method POST \
            "repos/${{ github.repository }}/deployments/$GITHUB_DEPLOYMENT_ID/statuses" \
            -f state="$STATE" \
            -f log_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -f description="production_revision=$TARGET_REVISION" >/dev/null
