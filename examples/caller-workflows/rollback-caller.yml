# Example: Call the reusable Rollback workflow.
# Copy to the service repository .github/workflows/ and run via workflow_dispatch.
# Pin to a tag or SHA — never use @main in production.

name: Rollback PROD (Caller)

on:
  workflow_dispatch:
    inputs:
      api_rollback_revision:
        description: "Known-good API revision to roll back to"
        required: true
        type: string
      web_rollback_revision:
        description: "Known-good Web revision to roll back to"
        required: false
        type: string
      confirm:
        description: "Type ROLLBACK_PROD to confirm"
        required: true
        type: string
      quality_commit_sha:
        description: "Commit SHA associated with the known-good rollback revision"
        required: true
        type: string
      runner_label:
        description: "Emergency runner label; leave empty for hosted runner"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  rollback:
    uses: diegomad14/gcp-engineering-platform-api/.github/workflows/reusable-cloud-run-rollback.yml@v0.15.0
    with:
      project-id: ${{ vars.GCP_PROJECT_ID }}
      region: ${{ vars.GCP_REGION }}
      workload-identity-provider: ${{ vars.GCP_WIF_PROVIDER }}
      deployer-service-account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}
      api-service-name: ${{ vars.API_SERVICE_NAME }}
      api-rollback-revision: ${{ inputs.api_rollback_revision }}
      web-service-name: ${{ vars.WEB_SERVICE_NAME }}
      web-rollback-revision: ${{ inputs.web_rollback_revision }}
      rollback-confirmation: ${{ inputs.confirm }}
      platform-api-url: ${{ vars.ENG_PLATFORM_API_URL }}
      quality-gate-enabled: true
      quality-commit-sha: ${{ inputs.quality_commit_sha }}
      api-health-url: ${{ vars.API_HEALTH_URL }}
      web-url: ${{ vars.WEB_URL }}
      expected-openapi-paths: "77"
      rollback-api: true
      rollback-web: ${{ vars.HAS_FRONTEND == 'true' }}
      runner_label: ${{ inputs.runner_label }}
    secrets:
      QUALITY_API_TOKEN: ${{ secrets.QUALITY_API_TOKEN }}
