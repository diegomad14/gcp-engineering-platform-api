# Example: Call the reusable Promote workflow.
# Copy to the service repository .github/workflows/ and run via workflow_dispatch.
# Pin to a tag or SHA — never use @main in production.

name: Promote to PROD (Caller)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g., v0.4.3)"
        required: true
        type: string
      api_revision:
        description: "API candidate revision to promote"
        required: true
        type: string
      web_revision:
        description: "Web candidate revision to promote"
        required: false
        type: string
      confirm:
        description: "Type PROMOTE_PROD to confirm"
        required: true
        type: string
      quality_commit_sha:
        description: "Commit SHA approved by the quality gate"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  promote:
    uses: diegomad14/gcp-engineering-platform-api/.github/workflows/reusable-cloud-run-promote.yml@v1
    with:
      project-id: ${{ vars.GCP_PROJECT_ID }}
      region: ${{ vars.GCP_REGION }}
      workload-identity-provider: ${{ vars.GCP_WIF_PROVIDER }}
      deployer-service-account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}
      version: ${{ inputs.release_tag }}
      api-service-name: ${{ vars.API_SERVICE_NAME }}
      api-target-revision: ${{ inputs.api_revision }}
      web-service-name: ${{ vars.WEB_SERVICE_NAME }}
      web-target-revision: ${{ inputs.web_revision }}
      promote-confirmation: ${{ inputs.confirm }}
      platform-api-url: ${{ vars.ENG_PLATFORM_API_URL }}
      quality-gate-enabled: true
      quality-commit-sha: ${{ inputs.quality_commit_sha }}
      api-health-url: ${{ vars.API_HEALTH_URL }}
      web-url: ${{ vars.WEB_URL }}
      expected-openapi-paths: "77"
      promote-api: true
      promote-web: ${{ vars.HAS_FRONTEND == 'true' }}
    secrets:
      QUALITY_API_TOKEN: ${{ secrets.QUALITY_API_TOKEN }}
