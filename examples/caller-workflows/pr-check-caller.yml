# Example: Call the reusable PR Check workflow.
# Copy this file to the service repository's .github/workflows/ directory.
# Pin to a tag or SHA — never use @main in production.

name: PR Check (Caller)

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  api-quality:
    uses: diegomad14/gcp-engineering-platform-api/.github/workflows/reusable-quality-gate.yml@v1
    with:
      service-name: ${{ vars.API_SERVICE_NAME }}
      profile: python
      working-directory: .
      coverage-threshold: 70
      platform-api-url: ${{ vars.ENG_PLATFORM_API_URL }}
    secrets:
      QUALITY_API_TOKEN: ${{ secrets.QUALITY_API_TOKEN }}

  web-quality:
    if: ${{ vars.HAS_FRONTEND == 'true' }}
    uses: diegomad14/gcp-engineering-platform-api/.github/workflows/reusable-quality-gate.yml@v1
    with:
      service-name: ${{ vars.WEB_SERVICE_NAME }}
      profile: node
      working-directory: frontend
      coverage-threshold: 70
      platform-api-url: ${{ vars.ENG_PLATFORM_API_URL }}
    secrets:
      QUALITY_API_TOKEN: ${{ secrets.QUALITY_API_TOKEN }}
